parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: tagNamePrefix
    displayName: 'Tag name prefix'
    type: string
    default: ''

  - name: tagName
    displayName: 'Tag name to create and push'
    type: string
    default: ''

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $tagNamePrefix = $env:TAG_NAME_PREFIX
      $tagName = $env:TAG_NAME
      $appendSummary = [System.Convert]::ToBoolean($env:APPEND_SUMMARY)
      $agentTempDirectory = $env:AGENT_TEMPDIRECTORY

      if ([string]::IsNullOrEmpty($tagName)) {
        Write-Host "##vso[task.logissue type=warning]No tag name provided; skipping"
        exit 0
      }

      $fullTagName = "${tagNamePrefix}${tagName}"

      if ($enableBuildDebug) {
        Write-Host "##[debug]Tag name: $fullTagName"
      }

      # Check if tag already exists on remote
      $existingTag = & git ls-remote --tags origin "refs/tags/$fullTagName" 2>&1
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Failed to check existing tags"
        exit 1
      }

      if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
        Write-Host "##vso[task.logissue type=warning]Tag '$fullTagName' already exists on remote; skipping"

        if ($appendSummary) {
          $summaryLines = @(
            "## Git Tag",
            "",
            "| Property | Value |",
            "| --- | --- |",
            "| Tag | ``$fullTagName`` |",
            "| Result | ⚠️ Already exists (skipped) |",
            ""
          )
          $summaryPath = "$agentTempDirectory/job-summary.md"
          Add-Content -Path $summaryPath -Value ($summaryLines -join "`n") -Encoding UTF8
        }

        exit 0
      }

      # Create and push lightweight tag
      & git tag $fullTagName
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Failed to create tag '$fullTagName'"
        exit 1
      }

      & git push origin $fullTagName
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Failed to push tag '$fullTagName'"
        exit 1
      }

      Write-Host "Successfully created and pushed tag '$fullTagName'"

      if ($appendSummary) {
        $summaryLines = @(
          "## Git Tag",
          "",
          "| Property | Value |",
          "| --- | --- |",
          "| Tag | ``$fullTagName`` |",
          "| Result | ✅ Created |",
          ""
        )
        $summaryPath = "$agentTempDirectory/job-summary.md"
        Add-Content -Path $summaryPath -Value ($summaryLines -join "`n") -Encoding UTF8
      }
    displayName: 'Create git tag'
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      TAG_NAME_PREFIX: ${{ parameters.tagNamePrefix }}
      TAG_NAME: ${{ parameters.tagName }}
      APPEND_SUMMARY: ${{ parameters.appendSummary }}
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
