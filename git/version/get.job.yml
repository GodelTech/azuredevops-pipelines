parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: jobName
    displayName: 'Job name'
    type: string
    default: 'GitVersion'

  - name: jobDisplayName
    displayName: 'Job display name'
    type: string
    default: 'Git version'

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'

  - name: dependsOn
    displayName: 'Job depends on'
    type: object
    default: []

  - name: enable
    displayName: 'Enable job'
    type: boolean
    default: true

  - name: stepName
    displayName: 'Step name to use as reference'
    type: string
    default: 'git_version_step'

  - name: buildSummary
    displayName: 'Build summary parameters'
    type: object
    default: {}
    # Example:
    # buildSummary:
    #   enable: true
    #   showSystemInfo: true

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobDisplayName }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    steps:
      - checkout: self
        fetchDepth: 0

      - task: gittools.gittools.setup-gitversion-task.gitversion-setup@4.3.3
        displayName: 'Install GitVersion tool'
        inputs:
          versionSpec: '6.6.x'

      - task: gittools.gittools.execute-gitversion-task.gitversion-execute@4.3.3
        displayName: 'Determine Git version'
        name: ${{ parameters.stepName }}
        inputs:
          overrideConfig: |
            semantic-version-format=Loose
            update-build-number=false

      - ${{ if eq(parameters.enableBuildDebug, true) }}:
          - pwsh: |
              $semVer = $env:GIT_VERSION_SEMVER
              Write-Host "SemVer '${{ parameters.stepName }}.semVer': $semVer"
            displayName: 'Display GitVersion SemVer output'
            env:
              GIT_VERSION_SEMVER: $(${{ parameters.stepName }}.semVer)

          - pwsh: |
              $fullSemVer = $env:GIT_VERSION_FULLSEMVER
              Write-Host "FullSemVer '${{ parameters.stepName }}.fullSemVer': $fullSemVer"
            displayName: 'Display GitVersion FullSemVer output'
            env:
              GIT_VERSION_FULLSEMVER: $(${{ parameters.stepName }}.fullSemVer)

      - template: '../../azuredevops/build/append-to-job-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Append GitVersion section to job summary'
          condition: |
            and
            (
              succeededOrFailed(),
              eq(${{ coalesce(parameters.buildSummary.enable, true) }}, true)
            )
          title: 'GitVersion'
          content: |
            | Property | Value |
            | --- | --- |
            | SemVer | $(${{ parameters.stepName }}.semVer) |
            | FullSemVer | $(${{ parameters.stepName }}.fullSemVer) |

      - template: '../../azuredevops/build/upload-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Upload GitVersion build summary'
          condition: |
            and
            (
              always(),
              eq(${{ coalesce(parameters.buildSummary.enable, true) }}, true)
            )
          title: 'GitVersion Summary'
          includeJobSummary: true
          ${{ if ne(parameters.buildSummary.showSystemInfo, '') }}:
            showSystemInfo: ${{ parameters.buildSummary.showSystemInfo }}
