parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: stepDisplayName
    displayName: 'Step display name'
    type: string
    default: 'Upload build summary'

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

  - name: title
    displayName: 'Summary title'
    type: string
    default: ''

  - name: content
    displayName: 'Markdown content to include in the summary'
    type: string
    default: ''

  - name: contentBlocks
    displayName: 'Content blocks to include in the summary'
    type: object
    default: []
    # Example:
    # contentBlocks:
    #   - title: 'Test Results'
    #     content: |
    #       | Suite | Passed | Failed |
    #       | --- | --- | --- |
    #       | Unit | 42 | 0 |
    #   - title: 'Coverage'
    #     content: '**Line coverage:** 95%'

  - name: includeJobSummary
    displayName: 'Include job summary from job-summary.md'
    type: boolean
    default: true

  - name: showSystemInfo
    displayName: 'Show system info table with build details'
    type: boolean
    default: false

  - name: fileName
    displayName: 'Summary file name'
    type: string
    default: 'summary.md'

steps:
  - pwsh: |
      $title = $env:SUMMARY_TITLE
      $content = $env:SUMMARY_CONTENT
      $contentBlocks = $env:SUMMARY_CONTENT_BLOCKS | ConvertFrom-Json
      $includeJobSummary = [System.Convert]::ToBoolean($env:SUMMARY_INCLUDE_JOB_SUMMARY)
      $showSystemInfo = [System.Convert]::ToBoolean($env:SUMMARY_SHOW_SYSTEM_INFO)
      $fileName = $env:SUMMARY_FILENAME

      $filePath = "$(Agent.TempDirectory)/$fileName"

      $lines = @()

      if ($null -ne $title) {
         $lines += "# $title"
         $lines += ""
      }

      if ($null -ne $content) {
        $lines += $content
        $lines += ""
      }

      foreach ($block in $contentBlocks) {
        if ($null -ne $block.title) {
          $lines += "## $($block.title)"
          $lines += ""
        }
        if ($null -ne $block.content) {
          $lines += $block.content.TrimEnd()
        }
      }

      if ($includeJobSummary) {
        $jobSummaryPath = "$(Agent.TempDirectory)/job-summary.md"
        if (Test-Path $jobSummaryPath) {
          if ($lines.Count -gt 0 -and $lines[-1] -ne '') {
            $lines += ""
          }
          $lines += Get-Content -Path $jobSummaryPath -Raw
        }
      }

      if ($showSystemInfo) {
         if ($lines.Count -gt 0 -and $lines[-1] -ne '') {
           $lines += ""
         }

         $lines += "## System Information"
         $lines += ""
         $lines += "| Property | Value |"
         $lines += "| --- | --- |"
         $lines += "| Build ID | $(Build.BuildId) |"
         $lines += "| Build Number | $(Build.BuildNumber) |"
         $lines += "| Branch | $(Build.SourceBranchName) |"
         $lines += "| Commit | $(Build.SourceVersion) |"
         $lines += "| Queued by | $(Build.QueuedBy) |"
         $lines += "| Agent | $(Agent.MachineName) |"
      }

      $lines | Set-Content -Path $filePath -Encoding UTF8

      Write-Host ($lines -join "`n")
      Write-Host "##vso[task.uploadsummary]$filePath"
    displayName: ${{ parameters.stepDisplayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    env:
      SUMMARY_TITLE: ${{ parameters.title }}
      SUMMARY_CONTENT: ${{ parameters.content }}
      SUMMARY_CONTENT_BLOCKS: ${{ convertToJson(parameters.contentBlocks) }}
      SUMMARY_INCLUDE_JOB_SUMMARY: ${{ parameters.includeJobSummary }}
      SUMMARY_SHOW_SYSTEM_INFO: ${{ parameters.showSystemInfo }}
      SUMMARY_FILENAME: ${{ parameters.fileName }}
