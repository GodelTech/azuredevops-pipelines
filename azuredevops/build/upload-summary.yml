parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: stepDisplayName
    displayName: 'Step display name'
    type: string
    default: 'Upload build summary'

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

  - name: title
    displayName: 'Summary title'
    type: string
    default: ''

  - name: content
    displayName: 'Markdown content to include in the summary'
    type: string
    default: ''

  - name: contentBlocks
    displayName: 'Content blocks to include in the summary'
    type: object
    default: []
    # Example:
    # contentBlocks:
    #   - title: 'Test Results'
    #     content: |
    #       | Suite | Passed | Failed |
    #       | --- | --- | --- |
    #       | Unit | 42 | 0 |
    #   - title: 'Coverage'
    #     content: '**Line coverage:** 95%'

  - name: includeJobSummary
    displayName: 'Include job summary from job-summary.md'
    type: boolean
    default: true

  - name: showSystemInfo
    displayName: 'Show system info table with build details'
    type: boolean
    default: false

  - name: fileName
    displayName: 'Summary file name'
    type: string
    default: 'summary.md'

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $title = $env:SUMMARY_TITLE
      $content = $env:SUMMARY_CONTENT
      $contentBlocks = $env:SUMMARY_CONTENT_BLOCKS | ConvertFrom-Json
      $includeJobSummary = [System.Convert]::ToBoolean($env:SUMMARY_INCLUDE_JOB_SUMMARY)
      $showSystemInfo = [System.Convert]::ToBoolean($env:SUMMARY_SHOW_SYSTEM_INFO)
      $fileName = $env:SUMMARY_FILENAME
      $agentTempDirectory = $env:AGENT_TEMPDIRECTORY
      $buildId = $env:BUILD_BUILDID
      $buildNumber = $env:BUILD_BUILDNUMBER
      $sourceBranchName = $env:BUILD_SOURCEBRANCHNAME
      $sourceVersion = $env:BUILD_SOURCEVERSION
      $queuedBy = $env:BUILD_QUEUEDBY
      $agentMachineName = $env:AGENT_MACHINENAME

      $filePath = "$agentTempDirectory/$fileName"

      $lines = @()

      if (-not [string]::IsNullOrEmpty($title)) {
        $lines += "# $title"
        $lines += ""
      }

      if (-not [string]::IsNullOrEmpty($content)) {
        $lines += $content.TrimEnd()
        $lines += ""
      }

      foreach ($block in $contentBlocks) {
        if ($null -ne $block.title) {
          $lines += "## $($block.title)"
          $lines += ""
        }
        if ($null -ne $block.content) {
          $lines += $block.content.TrimEnd()
        }
      }

      if ($includeJobSummary) {
        $jobSummaryPath = "$agentTempDirectory/job-summary.md"
        if (Test-Path $jobSummaryPath) {
          if ($lines.Count -gt 0 -and $lines[-1] -ne '') {
            $lines += ""
          }
          $lines += Get-Content -Path $jobSummaryPath -Raw
        }
      }

      if ($showSystemInfo) {
        if ($lines.Count -gt 0 -and $lines[-1] -ne '') {
          $lines += ""
        }

        $lines += "## System Information"
        $lines += ""
        $lines += "| Property | Value |"
        $lines += "| --- | --- |"
        $lines += "| Build ID | $buildId |"
        $lines += "| Build Number | $buildNumber |"
        $lines += "| Branch | $sourceBranchName |"
        $lines += "| Commit | $sourceVersion |"
        $lines += "| Queued by | $queuedBy |"
        $lines += "| Agent | $agentMachineName |"
      }

      $lines | Set-Content -Path $filePath -Encoding UTF8

      if ($enableBuildDebug) {
        Write-Host "##[debug]Summary file path: $filePath"
        Write-Host "##[debug]Content block count: $($contentBlocks.Count)"
        Write-Host "##[debug]Include job summary: $includeJobSummary"
      }

      Write-Host ($lines -join "`n")
      Write-Host "##vso[task.uploadsummary]$filePath"
    displayName: ${{ parameters.stepDisplayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      SUMMARY_TITLE: ${{ parameters.title }}
      SUMMARY_CONTENT: ${{ parameters.content }}
      SUMMARY_CONTENT_BLOCKS: ${{ convertToJson(parameters.contentBlocks) }}
      SUMMARY_INCLUDE_JOB_SUMMARY: ${{ parameters.includeJobSummary }}
      SUMMARY_SHOW_SYSTEM_INFO: ${{ parameters.showSystemInfo }}
      SUMMARY_FILENAME: ${{ parameters.fileName }}
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
      BUILD_BUILDID: $(Build.BuildId)
      BUILD_BUILDNUMBER: $(Build.BuildNumber)
      BUILD_SOURCEBRANCHNAME: $(Build.SourceBranchName)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_QUEUEDBY: $(Build.QueuedBy)
      AGENT_MACHINENAME: $(Agent.MachineName)
