parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: stepName
    displayName: 'Step name to use as reference'
    type: string
    default: 'check_build_warnings_step'

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

  - name: warningThreshold
    displayName: 'Maximum number of warnings allowed before triggering step result'
    type: number
    default: 0

  - name: logIssueOnWarnings
    displayName: 'Log issue on warnings'
    type: boolean
    default: true

  - name: stepResultOnWarnings
    displayName: 'Step result to set if warnings are found'
    type: string
    default: 'SucceededWithIssues'
    values:
      - Succeeded
      - SucceededWithIssues
      - Failed

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $warningThreshold = [int]$env:WARNING_THRESHOLD
      $logIssueOnWarnings = [System.Convert]::ToBoolean($env:LOG_ISSUE_ON_WARNINGS)
      $stepResultOnWarnings = $env:STEP_RESULT_ON_WARNINGS
      $accessToken = $env:SYSTEM_ACCESSTOKEN
      $collectionUri = $env:SYSTEM_COLLECTIONURI
      $teamProject = $env:SYSTEM_TEAMPROJECT
      $buildId = $env:BUILD_BUILDID

      $headers = @{ Authorization = "Bearer $accessToken" }
      $url = "$collectionUri$teamProject/_apis/build/builds/$buildId/timeline?api-version=7.1"

      if ($enableBuildDebug) {
        Write-Host "##[debug]Timeline API URL: $url"
      }

      $timeline = $null
      try {
        $timeline = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop
      } catch {
        Write-Host "##vso[task.logissue type=error]Failed to retrieve build timeline: $_"
        exit 1
      }

      # -- Check warning threshold ---------------------------------------------------------------
      $warningRecords = $timeline.records | Where-Object { $_.warningCount -gt 0 }
      $totalWarnings = ($warningRecords | Measure-Object -Property warningCount -Sum).Sum

      if (-not $totalWarnings) { $totalWarnings = 0 }

      Write-Host "Total warnings : $totalWarnings"
      Write-Host "Threshold      : $warningThreshold"

      if ($enableBuildDebug) {
        Write-Host "##[debug]Timeline records with warnings: $($warningRecords.Count)"
      }

      # -- Set output variables ------------------------------------------------------------------
      $message = "Build completed with $totalWarnings warning(s) (threshold: $warningThreshold)"

      if ($totalWarnings -gt $warningThreshold) {
        Write-Host "##vso[task.setvariable variable=hasWarnings;isOutput=true]true"
        Write-Host "##vso[task.setvariable variable=warningCount;isOutput=true]$totalWarnings"
        Write-Host "##vso[task.setvariable variable=isThresholdExceeded;isOutput=true]true"

        if ($logIssueOnWarnings) {
          $issueType = if ($stepResultOnWarnings -eq 'Failed') { 'error' } else { 'warning' }
          Write-Host "##vso[task.logissue type=$issueType]$message"
        } else {
          Write-Host "##[warning]$message"
        }
      } elseif ($totalWarnings -gt 0) {
        Write-Host "##vso[task.setvariable variable=hasWarnings;isOutput=true]true"
        Write-Host "##vso[task.setvariable variable=warningCount;isOutput=true]$totalWarnings"
        Write-Host "##vso[task.setvariable variable=isThresholdExceeded;isOutput=true]false"

        if ($logIssueOnWarnings) {
          Write-Host "##vso[task.logissue type=warning]$message"
        } else {
          Write-Host "##[warning]$message"
        }
      } else {
        Write-Host "##vso[task.setvariable variable=hasWarnings;isOutput=true]false"
        Write-Host "##vso[task.setvariable variable=warningCount;isOutput=true]$totalWarnings"
        Write-Host "##vso[task.setvariable variable=isThresholdExceeded;isOutput=true]false"
      }

      # -- Finalize task result ------------------------------------------------------------------
      if ($totalWarnings -gt $warningThreshold) {
        Write-Host "##vso[task.complete result=$stepResultOnWarnings;]$message"
      }
    displayName: 'Check for build warnings'
    name: ${{ parameters.stepName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      WARNING_THRESHOLD: ${{ parameters.warningThreshold }}
      LOG_ISSUE_ON_WARNINGS: ${{ parameters.logIssueOnWarnings }}
      STEP_RESULT_ON_WARNINGS: ${{ parameters.stepResultOnWarnings }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECT: $(System.TeamProject)
      BUILD_BUILDID: $(Build.BuildId)
