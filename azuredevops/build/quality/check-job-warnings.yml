parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

steps:
  - task: BuildQualityChecks@10
    displayName: 'Warnings quality check'
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    inputs:
      checkWarnings: true
      warningTaskFilters: '/.*/'
      warningFailOption: 'fixed'
      warningThreshold: '0'
      showStatistics: true
