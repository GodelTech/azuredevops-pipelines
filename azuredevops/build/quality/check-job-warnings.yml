parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: checkWarnings
    displayName: 'Check warnings'
    type: boolean
    default: true

steps:
  - task: BuildQualityChecks@10
    displayName: 'Warnings quality check'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.checkWarnings }}, true)
      )
    inputs:
      checkWarnings: true
      warningTaskFilters: '/.*/'
      warningFailOption: 'fixed'
      warningThreshold: '0'
      showStatistics: true
