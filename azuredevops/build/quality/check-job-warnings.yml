parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

  - name: warningThreshold
    displayName: 'Maximum number of warnings allowed before failing'
    type: string
    default: '0'

  - name: showStatistics
    displayName: 'Show per-task warning statistics in the log'
    type: boolean
    default: true

steps:
  - task: BuildQualityChecks@10
    displayName: 'Warnings quality check'
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    inputs:
      checkWarnings: true
      warningTaskFilters: '/.*/'
      warningFailOption: 'fixed'
      warningThreshold: ${{ parameters.warningThreshold }}
      showStatistics: ${{ parameters.showStatistics }}
