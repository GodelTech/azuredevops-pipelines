parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: stepName
    displayName: 'Step name to use as reference'
    type: string
    default: 'check_output_variable_step'

  - name: variableDisplayName
    displayName: 'Variable display name'
    type: string

  - name: variableValue
    displayName: 'Variable value'
    type: string
    # Example:
    # variableValue: $(<stepName>.<varName>)                                        # same-job
    # variableValue: $[ dependencies.<jobName>.outputs['<stepName>.<varName>'] ]    # cross-job

  - name: expectedValue
    displayName: 'Expected value'
    type: string
    default: ''

  - name: skipValidation
    displayName: 'Skip validation (only log variable value)'
    type: boolean
    default: false

  - name: logIssueOnMismatch
    displayName: 'Log issue on mismatch (if validation is not skipped)'
    type: boolean
    default: true

  - name: stepResultOnMismatch
    displayName: 'Step result when actual value does not match expected value'
    type: string
    default: 'Failed'
    values:
      - Succeeded
      - SucceededWithIssues
      - Failed

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

steps:
  - pwsh: |
      $variableDisplayName   = $env:VARIABLE_DISPLAY_NAME
      $variableValue         = $env:VARIABLE_VALUE
      $expectedValue         = $env:EXPECTED_VALUE
      $stepResultOnMismatch  = $env:STEP_RESULT_ON_MISMATCH
      $skipValidation        = [System.Convert]::ToBoolean($env:SKIP_VALIDATION)
      $logIssueOnMismatch    = [System.Convert]::ToBoolean($env:LOG_ISSUE_ON_MISMATCH)

      Write-Host "Variable : $variableDisplayName"
      Write-Host "Value    : $variableValue"
      Write-Host "Expected : $expectedValue"

      if ($skipValidation) {
        Write-Host "Result   : SKIPPED (validation disabled)"
        Write-Host "##vso[task.setvariable variable=matchResult;isOutput=true]Skipped"
      } else {
        if ($variableValue -eq $expectedValue) {
          Write-Host "Result   : MATCH"
          Write-Host "##vso[task.setvariable variable=matchResult;isOutput=true]Matched"
        } else {
          $message = "Variable '$variableDisplayName' value '$variableValue' does not match expected '$expectedValue'"

          Write-Host "##vso[task.setvariable variable=matchResult;isOutput=true]Mismatched"

          switch ($stepResultOnMismatch) {
            'SucceededWithIssues' {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=warning]$message"
              } else {
                Write-Host "##[warning]$message"
              }
              Write-Host "Result   : MISMATCH (warning)"
              Write-Host "##vso[task.complete result=SucceededWithIssues;]$message"
            }
            'Failed' {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=error]$message"
              } else {
                Write-Host "##[error]$message"
              }
              Write-Host "Result   : MISMATCH (failure)"
              Write-Host "##vso[task.complete result=Failed;]$message"
            }
            default {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=warning]$message"
              } else {
                Write-Host "##[warning]$message"
              }
              Write-Host "Result   : MISMATCH (ignored)"
            }
          }
        }
      }
    displayName: 'Check output variable: "${{ parameters.variableDisplayName }}"'
    name: ${{ parameters.stepName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    env:
      VARIABLE_DISPLAY_NAME: ${{ parameters.variableDisplayName }}
      VARIABLE_VALUE: ${{ parameters.variableValue }}
      EXPECTED_VALUE: ${{ parameters.expectedValue }}
      STEP_RESULT_ON_MISMATCH: ${{ parameters.stepResultOnMismatch }}
      SKIP_VALIDATION: ${{ parameters.skipValidation }}
      LOG_ISSUE_ON_MISMATCH: ${{ parameters.logIssueOnMismatch }}
