parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: variableName
    displayName: 'Variable name (for display purposes)'
    type: string

  - name: variableValue
    displayName: 'Variable value'
    type: string
    # Example:
    # variableValue: $(steps.<stepName>.outputs['<varName>'])         # same-job
    # variableValue: $[dependencies.<job>.outputs['<step>.<var>']]    # cross-job

  - name: expectedValue
    displayName: 'Expected value'
    type: string
    default: ''

  - name: skipValidation
    displayName: 'Skip validation (only log variable value)'
    type: boolean
    default: false

  - name: logIssueOnMismatch
    displayName: 'Log issue on mismatch (if validation is not skipped)'
    type: boolean
    default: true

  - name: stepResultOnMismatch
    displayName: 'Step result when actual value does not match expected value'
    type: string
    default: 'Failed'
    values:
      - Succeeded
      - SucceededWithIssues
      - Failed

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

steps:
  - pwsh: |
      $variableName          = '${{ parameters.variableName }}'
      $variableValue         = '${{ parameters.variableValue }}'
      $expectedValue         = '${{ parameters.expectedValue }}'
      $stepResultOnMismatch  = '${{ parameters.stepResultOnMismatch }}'
      $skipValidation        = [System.Convert]::ToBoolean('${{ parameters.skipValidation }}')
      $logIssueOnMismatch    = [System.Convert]::ToBoolean('${{ parameters.logIssueOnMismatch }}')

      Write-Host "Variable : $variableName"
      Write-Host "Value    : $variableValue"
      Write-Host "Expected : $expectedValue"

      if ($skipValidation) {
        Write-Host "Result   : SKIPPED (validation disabled)"
      } else {
        if ($variableValue -eq $expectedValue) {
          Write-Host "Result   : MATCH"
        } else {
          $message = "Variable '$variableName' value '$variableValue' does not match expected '$expectedValue'"

          switch ($stepResultOnMismatch) {
            'SucceededWithIssues' {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=warning]$message"
              } else {
                Write-Host "##[warning]$message"
              }
              Write-Host "Result   : MISMATCH (warning)"
              Write-Host "##vso[task.complete result=SucceededWithIssues;]$message"
            }
            'Failed' {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=error]$message"
              } else {
                Write-Host "##[error]$message"
              }
              Write-Host "Result   : MISMATCH (failure)"
              Write-Host "##vso[task.complete result=Failed;]$message"
            }
            default {
              if ($logIssueOnMismatch) {
                Write-Host "##vso[task.logissue type=warning]$message"
              } else {
                Write-Host "##[warning]$message"
              }
              Write-Host "Result   : MISMATCH (ignored)"
            }
          }
        }
      }
    displayName: 'Check output variable: "${{ parameters.variableName }}"'
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
