parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: stepDisplayName
    displayName: 'Step display name'
    type: string
    default: 'Append to job summary'

  - name: condition
    displayName: 'Condition'
    type: string
    default: ''

  - name: title
    displayName: 'Section title'
    type: string
    default: ''

  - name: content
    displayName: 'Markdown content to append'
    type: string
    default: ''

  - name: contentBlocks
    displayName: 'Content blocks to include in the summary'
    type: object
    default: []
    # Example:
    # contentBlocks:
    #   - title: 'Test Results'
    #     content: |
    #       | Suite | Passed | Failed |
    #       | --- | --- | --- |
    #       | Unit | 42 | 0 |
    #   - title: 'Coverage'
    #     content: '**Line coverage:** 95%'
    #     noNewLine: true

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $title = $env:SUMMARY_TITLE
      $content = $env:SUMMARY_CONTENT
      $contentBlocks = $env:SUMMARY_CONTENT_BLOCKS | ConvertFrom-Json
      $agentTempDirectory = $env:AGENT_TEMPDIRECTORY

      $filePath = "$agentTempDirectory/job-summary.md"

      $lines = @()

      if (-not [string]::IsNullOrEmpty($title)) {
        $lines += "## $title"
        $lines += ""
      }

      if (-not [string]::IsNullOrEmpty($content)) {
        $lines += $content.TrimEnd()
        $lines += ""
      }

      foreach ($block in $contentBlocks) {
        if ($null -ne $block.title) {
          $lines += "## $($block.title)"
          $lines += ""
        }
        if ($null -ne $block.content) {
          $lines += $block.content.TrimEnd()
          if (-not $block.noNewLine) {
            $lines += ""
          }
        }
      }

      Add-Content -Path $filePath -Value ($lines -join "`n") -Encoding UTF8

      if ($enableBuildDebug) {
        Write-Host "##[debug]Job summary file path: $filePath"
        Write-Host "##[debug]Content block count: $($contentBlocks.Count)"
      }

      Write-Host "Appended to job summary:"
      Write-Host ($lines -join "`n")
    displayName: ${{ parameters.stepDisplayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      SUMMARY_TITLE: ${{ parameters.title }}
      SUMMARY_CONTENT: ${{ parameters.content }}
      SUMMARY_CONTENT_BLOCKS: ${{ convertToJson(parameters.contentBlocks) }}
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
