parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: expectedBuildResult
    displayName: 'Expected build result'
    type: string
    default: 'Succeeded'
    values:
      - Succeeded
      - PartiallySucceeded
      - Failed
      - Canceled

  - name: buildResultDescription
    displayName: 'Build result description'
    type: string
    default: '_No description provided_'

  - name: outputVariables
    displayName: 'Output variables to check'
    type: object
    default: []
    # Example:
    # outputVariables:
    #   - name: myStep.myVar
    #     value: $(steps.myStep.outputs['myVar'])
    #     expectedValue: 'expectedResult'
    #   - name: myStep.myVar
    #     value: $[dependencies.myJob.outputs['myStep.myVar']]
    #     expectedValue: 'expectedResult'
    #     stepResultOnMismatch: 'SucceededWithIssues'
    #     condition: always()

  - name: warningThreshold
    displayName: 'Maximum number of warnings'
    type: number
    default: 0

  - name: cancelBuildCondition
    displayName: 'Cancel build condition (only applicable when expected build result is "Canceled")'
    type: string
    default: ''

steps:
  - ${{ each variable in parameters.outputVariables }}:
      - template: '../../azuredevops/build/check-output-variables.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          variableName: ${{ variable.name }}
          variableValue: ${{ variable.value }}
          expectedValue: ${{ variable.expectedValue }}
          stepResultOnMismatch: ${{ coalesce(variable.stepResultOnMismatch, 'Failed') }}
          condition: ${{ coalesce(variable.condition, 'always()') }}

  - template: '../../azuredevops/build/upload-summary.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      title: 'Build Summary'
      content: |
        ### This is TEST build summary

        ### Expected build result: **_${{ parameters.expectedBuildResult }}_**

        **Build result description:**
        ${{ parameters.buildResultDescription }}

        $(buildSummaryVariablesTable)
      ${{ if gt(length(parameters.outputVariables), 0) }}:
        contentBlocks:
          - title: 'Output variables details'
            content: |
              | Variable | Value | Expected |
              | --- | --- | --- |
          - ${{ each variable in parameters.outputVariables }}:
              - content: |
                  | ${{ variable.name }} | ${{ variable.value }} | ${{ variable.expectedValue }} |
      condition: always()

  - template: '../../azuredevops/build/quality/check-build-warnings.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      stepName: 'upload_build_summary_check_warnings_step'
      warningThreshold: ${{ parameters.warningThreshold }}
      stepResultOnWarnings: 'Failed'
      condition: always()

  - ${{ if eq(parameters.expectedBuildResult, 'Canceled') }}:
      - template: '../../azuredevops/build/cancel-build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.cancelBuildCondition, '') }}:
            condition: ${{ parameters.cancelBuildCondition }}
