parameters:
  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/CI.yml
      - '.scripts/*'
      - .yamllint
      - '*.yml'

pr:
  branches:
    include:
      - '*'

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: Lint
    displayName: 'YAML lint'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        displayName: 'Use Python 3.x'
        inputs:
          versionSpec: '3.x'

      - script: pip install yamllint
        displayName: 'Install yamllint'

      - script: yamllint .
        displayName: 'Run yamllint'

  - job: CheckTriggers
    displayName: 'Check triggers'
    dependsOn: Lint
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self

      - task: PowerShell@2
        displayName: 'Run check-triggers'
        inputs:
          filePath: '.scripts/check-triggers.ps1'
          pwsh: true

  - job: CheckSchedules
    displayName: 'Check schedules'
    dependsOn: CheckTriggers
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self

      - task: PowerShell@2
        displayName: 'Run check-schedules'
        inputs:
          filePath: '.scripts/check-schedules.ps1'
          pwsh: true

  - job: CheckTestCoverage
    displayName: 'Check test coverage'
    dependsOn: CheckSchedules
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self

      - task: PowerShell@2
        displayName: 'Run check-test-coverage'
        inputs:
          filePath: '.scripts/check-test-coverage.ps1'
          pwsh: true
