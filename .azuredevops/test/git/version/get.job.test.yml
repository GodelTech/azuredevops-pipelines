# test-git-version-get.job.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/git/version/get.job.test.yml
      - git/version/get.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/git/version/get.job.test.yml
      - git/version/get.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  gitvVersionJobName: 'GitVersion'
  gitVersionStepName: 'git_version_step'
  gitVersionSemVer: '${{ variables.gitVersionStepName }}.semVer'
  gitVersionFullSemVer: '${{ variables.gitVersionStepName }}.fullSemVer'

jobs:
  - template: '../../../../git/version/get.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: ${{ variables.gitvVersionJobName }}
      vmImage: ${{ parameters.vmImage }}
      stepName: ${{ variables.gitVersionStepName }}

  - template: '../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - ${{ variables.gitvVersionJobName }}
      variables:
        gitvVersionSemVer: $[ dependencies.${{ variables.gitvVersionJobName }}.outputs['${{ variables.gitVersionSemVer }}'] ]
        gitvVersionFullSemVer: $[ dependencies.${{ variables.gitvVersionJobName }}.outputs['${{ variables.gitVersionFullSemVer }}'] ]
      expectedBuildResult: 'Succeeded'
      outputVariables:
        - displayName: "dependencies.${{ variables.gitvVersionJobName }}.outputs['${{ variables.gitVersionSemVer }}']"
          value: $(gitvVersionSemVer)
          stepName: 'check_output_variable_step_SemVer'
          skipValidation: true
        - displayName: "dependencies.${{ variables.gitvVersionJobName }}.outputs['${{ variables.gitVersionFullSemVer }}']"
          value: $(gitvVersionFullSemVer)
          stepName: 'check_output_variable_step_FullSemVer'
          skipValidation: true
      buildResultDescription: |
        Job **'Git version'**
        Step **'Determine Git version'** result must be: **Succeeded**
