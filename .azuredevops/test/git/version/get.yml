# test-git-version-get.yml
name: asdf/sdfasdf/asd/fasdf/a/sdfasdfasdf

trigger: none

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - template: '../../../../git/version/get.yml'
    parameters:
      enablePipelineDebug: true
      vmImage: 'ubuntu-latest'

  - job: BuildQualityChecks
    displayName: 'Build quality checks'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - template: '../../../../azuredevops/pipeline/quality/check-warnings.yml'
        parameters:
          enablePipelineDebug: true
          checkWarnings: true
