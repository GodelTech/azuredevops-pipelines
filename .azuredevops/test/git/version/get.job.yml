# test-git-version-get.job.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger: none

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  gitvVersionJobName: 'GitVersion'
  gitVersionStepName: 'git_version_step'
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningStepResult: 'SucceededWithIssues'

jobs:
  - template: '../../../../git/version/get.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: ${{ variables.gitvVersionJobName }}
      vmImage: ${{ parameters.vmImage }}
      stepName: ${{ variables.gitVersionStepName }}

  - template: '../../../../azuredevops/build/job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: 'BuildQualityChecks'
      jobDisplayName: 'Build quality checks'
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - ${{ variables.gitvVersionJobName }}
      checkOutSourceCode: false
      jobSteps:
        - template: '../../../../azuredevops/build/quality/check-build-warnings.yml'
          parameters:
            enableBuildDebug: ${{ parameters.enableBuildDebug }}
            checkWarnings: true
            stepName: ${{ variables.checkBuildWarningStepName }}
            stepResult: ${{ variables.checkBuildWarningStepResult }}
