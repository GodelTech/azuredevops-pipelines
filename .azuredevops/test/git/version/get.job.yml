# test-git-version-get.job.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/git/version/get.job.yml
      - git/version/get.job.yml
      - azuredevops/build/quality/check-build-warnings.yml
      - .azuredevops/testHelpers/build-summary-validation.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  gitvVersionJobName: 'GitVersion'
  gitVersionStepName: 'git_version_step'
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningStepResultOnWarnings: 'SucceededWithIssues'

jobs:
  - template: '../../../../git/version/get.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: ${{ variables.gitvVersionJobName }}
      vmImage: ${{ parameters.vmImage }}
      stepName: ${{ variables.gitVersionStepName }}

  - job: BuildQualityChecks
    displayName: 'Build quality checks'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - ${{ variables.gitvVersionJobName }}
    steps:
      - checkout: none

      - template: '../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepResultOnWarnings: ${{ variables.checkBuildWarningStepResultOnWarnings }}

      - template: '../../../../.azuredevops/testHelpers/build-summary-validation.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
