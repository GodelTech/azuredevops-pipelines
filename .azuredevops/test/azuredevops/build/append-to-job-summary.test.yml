# test-azuredevops-build-append-to-job-summary.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/append-to-job-summary.test.yml
      - azuredevops/build/append-to-job-summary.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/azuredevops/build/append-to-job-summary.test.yml
      - azuredevops/build/append-to-job-summary.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: AppendToJobSummary
    displayName: 'Append to job summary'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - template: '../../../../azuredevops/build/append-to-job-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Append to job summary'
          condition: succeededOrFailed()
          title: 'Test Section'
          content: 'Test content line.'

      - pwsh: |
          $agentTempDirectory = $env:AGENT_TEMPDIRECTORY
          $filePath = "$agentTempDirectory/job-summary.md"
          Write-Host "##vso[task.uploadsummary]$filePath"
        displayName: 'Upload job summary'
        condition: succeededOrFailed()
        env:
          AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

  - job: AppendToJobSummaryWithContentBlocks
    displayName: 'Append to job summary with content blocks'
    dependsOn: AppendToJobSummary
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - template: '../../../../azuredevops/build/append-to-job-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Append to job summary with content blocks'
          condition: succeededOrFailed()
          contentBlocks:
            - title: 'Test Results'
              content: |
                | Suite | Passed | Failed |
                | --- | --- | --- |
                | Unit | 42 | 0 |
            - title: 'Coverage'
              content: '**Line coverage:** 95%'

      - pwsh: |
          $agentTempDirectory = $env:AGENT_TEMPDIRECTORY
          $filePath = "$agentTempDirectory/job-summary.md"
          Write-Host "##vso[task.uploadsummary]$filePath"
        displayName: 'Upload job summary'
        condition: succeededOrFailed()
        env:
          AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

  - template: '../../../testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - AppendToJobSummaryWithContentBlocks
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Append to job summary'**
        Step **'Append to job summary'** result must be: **Succeeded**
        Step **'Upload job summary'** result must be: **Succeeded**

        Job **'Append to job summary with content blocks'**
        Step **'Append to job summary with content blocks'** result must be: **Succeeded**
        Step **'Upload job summary'** result must be: **Succeeded**
