# test-azuredevops-build-check-output-variable.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/check-output-variable.test.yml
      - azuredevops/build/check-output-variable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/azuredevops/build/check-output-variable.test.yml
      - azuredevops/build/check-output-variable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: SetOutputVariable
    displayName: 'Set output variable'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - pwsh: |
          Write-Host '##vso[task.setvariable variable=testOutput;isOutput=true]testValue'
        displayName: 'Set output variable "testOutput"'
        name: set_output_variable_step

      - pwsh: |
          Write-Host "Output variable 'testOutput': $(set_output_variable_step.testOutput)"
        displayName: 'Show output variable "testOutput"'

      - template: '../../../../azuredevops/build/check-output-variable.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          variableDisplayName: 'testOutput'
          variableValue: $(set_output_variable_step.testOutput)
          expectedValue: 'testValue'
          stepResultOnMismatch: 'Failed'

  - template: '../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - SetOutputVariable
      variables:
        setOutputVariableResult: $[ dependencies.SetOutputVariable.result ]
        setOutputVariableTestOutput: $[ dependencies.SetOutputVariable.outputs['set_output_variable_step.testOutput'] ]
      expectedBuildResult: 'Succeeded'
      outputVariables:
        - displayName: "dependencies.SetOutputVariable.outputs['set_output_variable_step.testOutput']"
          value: $(setOutputVariableTestOutput)
          expectedValue: 'testValue'
      buildResultDescription: |
        Job **'Set output variable'**
        Step **'Check output variable: "testOutput"'** result must be: **Succeeded**
