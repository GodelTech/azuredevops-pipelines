# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger: none

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningStepOutputVariableName: 'hasWarnings'
  checkBuildWarningStepResult: 'SucceededWithIssues'

jobs:
  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - bash: |
          echo "##vso[task.logissue type=warning]Test warning message."

  - job: CheckBuildWarnings
    displayName: 'Check build warnings'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          checkWarnings: true
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepOutputVariableName: ${{ variables.checkBuildWarningStepOutputVariableName }}
          stepResult: ${{ variables.checkBuildWarningStepResult }}

      - template: '../../../../../azuredevops/build/cancel-build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          condition: |
            and
            (
              succeededOrFailed(),
              eq(variables['Agent.JobStatus'], 'SucceededWithIssues'),
              eq(variables['${{ variables.checkBuildWarningStepOutputVariableName }}'], 'true')
            )
