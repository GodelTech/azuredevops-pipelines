# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/check-output-variables.yml
      - .azuredevops/testHelpers/build-summary-validation.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningStepOutputVariableName: 'hasWarnings'
  checkBuildWarningStepResultOnWarnings: 'SucceededWithIssues'

jobs:
  - job: CheckBuildWarningsEmpty
    displayName: 'Check build warnings (empty)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      outputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningStepOutputVariableName }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepOutputVariableName: ${{ variables.checkBuildWarningStepOutputVariableName }}
          stepResultOnWarnings: 'Failed'

      - template: '../../../../../azuredevops/build/check-output-variables.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          variableName: ${{ variables.outputVariableExpression }}
          variableValue: $(${{ variables.outputVariableExpression }})
          expectedValue: 'false'
          stepResultOnMismatch: 'Failed'

  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - CheckBuildWarningsEmpty
    steps:
      - checkout: none

      - bash: |
          echo "##vso[task.logissue type=warning]Test warning message."
        displayName: 'Set build warning'

  - job: CheckBuildWarningsExist
    displayName: 'Check build warnings (exist)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    variables:
      outputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningStepOutputVariableName }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepOutputVariableName: ${{ variables.checkBuildWarningStepOutputVariableName }}
          stepResultOnWarnings: ${{ variables.checkBuildWarningStepResultOnWarnings }}

      - template: '../../../../../.azuredevops/testHelpers/build-summary-validation.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          expectedBuildResult: 'Canceled'
          outputVariables:
            - name: ${{ variables.outputVariableExpression }}
              value: $(${{ variables.outputVariableExpression }})
              expectedValue: 'true'
          buildResultDescription: |
            Job **'$(Agent.JobName)'**
            Step **'${{ variables.checkBuildWarningStepName }}'** result must be: **${{ variables.checkBuildWarningStepResultOnWarnings }}**

            Output variable **'${{ variables.outputVariableExpression }}'** value: **$(${{ variables.outputVariableExpression }})**
          cancelBuildCondition: |
            and
            (
              succeededOrFailed(),
              eq(variables['Agent.JobStatus'], 'SucceededWithIssues'),
              eq(variables['${{ variables.outputVariableExpression }}'], 'true')
            )
