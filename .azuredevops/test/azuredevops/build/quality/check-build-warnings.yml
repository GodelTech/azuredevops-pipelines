# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/check-output-variable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningHasWarningsOutputVariable: 'hasWarnings'
  checkBuildWarningStepResultOnWarnings: 'SucceededWithIssues'

jobs:
  - job: CheckBuildWarningsEmpty
    displayName: 'Check build warnings (empty)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      hasWarningsOutputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningHasWarningsOutputVariable }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepResultOnWarnings: 'Failed'

      - template: '../../../../../azuredevops/build/check-output-variable.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          variableName: ${{ variables.hasWarningsOutputVariableExpression }}
          variableValue: $(${{ variables.hasWarningsOutputVariableExpression }})
          expectedValue: 'false'
          stepResultOnMismatch: 'Failed'

  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - CheckBuildWarningsEmpty
    steps:
      - checkout: none

      - bash: |
          echo "##vso[task.logissue type=warning]Test warning message."
        displayName: 'Set build warning'

  - job: CheckBuildWarningsExist
    displayName: 'Check build warnings (exist)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    variables:
      hasWarningsOutputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningHasWarningsOutputVariable }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepResultOnWarnings: ${{ variables.checkBuildWarningStepResultOnWarnings }}

  - template: '../../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - CheckBuildWarningsExist
      expectedBuildResult: 'Canceled'
      outputVariables:
        - name: ${{ variables.hasWarningsOutputVariableExpression }}
          value: $(${{ variables.hasWarningsOutputVariableExpression }})
          expectedValue: 'true'
      buildResultDescription: |
        Job **'$(Agent.JobName)'**
        Step **'${{ variables.checkBuildWarningStepName }}'** result must be: **${{ variables.checkBuildWarningStepResultOnWarnings }}**
      warningThreshold: 1
      cancelBuildCondition: |
        and
        (
          succeededOrFailed(),
          eq(variables['Agent.JobStatus'], 'SucceededWithIssues'),
          eq(variables['${{ variables.hasWarningsOutputVariableExpression }}'], 'true')
        )
