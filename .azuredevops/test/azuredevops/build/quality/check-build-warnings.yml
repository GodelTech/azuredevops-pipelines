# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/cancel-build.yml
      - .azuredevops/testHelpers/upload-build-summary.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  checkBuildWarningStepName: 'check_build_warnings_step'
  checkBuildWarningStepOutputVariableName: 'hasWarnings'
  checkBuildWarningStepResult: 'SucceededWithIssues'

jobs:
  - job: CheckBuildWarningsEmpty
    displayName: 'Check build warnings (empty)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      outputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningStepOutputVariableName }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          checkWarnings: true
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepOutputVariableName: ${{ variables.checkBuildWarningStepOutputVariableName }}
          stepResult: 'Failed'

      - script: |
          echo "Build warning output variable '${{ variables.outputVariableExpression }}': $(${{ variables.outputVariableExpression }})"
        displayName: 'Display build warning output variable'

  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - CheckBuildWarningsEmpty
    steps:
      - checkout: none

      - bash: |
          echo "##vso[task.logissue type=warning]Test warning message."
        displayName: 'Set build warning'

  - job: CheckBuildWarningsExist
    displayName: 'Check build warnings (exist)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    variables:
      outputVariableExpression: '${{ variables.checkBuildWarningStepName }}.${{ variables.checkBuildWarningStepOutputVariableName }}'
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          checkWarnings: true
          stepName: ${{ variables.checkBuildWarningStepName }}
          stepOutputVariableName: ${{ variables.checkBuildWarningStepOutputVariableName }}
          stepResult: ${{ variables.checkBuildWarningStepResult }}

      - script: |
          echo "Build warning output variable '${{ variables.outputVariableExpression }}': $(${{ variables.outputVariableExpression }})"
        displayName: 'Display build warning output variable'

      - template: '../../../../../azuredevops/build/cancel-build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          condition: |
            and
            (
              succeededOrFailed(),
              eq(variables['Agent.JobStatus'], 'SucceededWithIssues'),
              eq(variables['${{ variables.outputVariableExpression }}'], 'true')
            )

      - template: '../../../../../.azuredevops/testHelpers/upload-build-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          expectedBuildResult: 'Canceled'
          buildResultDescription: |
            Build was **canceled** due to detected warnings.

            Job **'$(Agent.JobName)'**
            Step **'${{ variables.checkBuildWarningStepName }}'** result must be: **${{ variables.checkBuildWarningStepResult }}**

            Output variable **'${{ variables.checkBuildWarningStepOutputVariableName }}'** value: **$(${{ variables.outputVariableExpression }})**
