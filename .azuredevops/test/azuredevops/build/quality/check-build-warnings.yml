# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger: none

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ${{ parameters.vmImage }}

steps:
  - bash: |
      echo "##[warning]Warning message"

  - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      checkWarnings: true
