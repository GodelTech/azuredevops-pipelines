# test-azuredevops-build-quality-check-build-warnings.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/quality/check-build-warnings.yml
      - azuredevops/build/check-output-variable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  checkBuildWarningHasWarningsOutputVariable: 'check_build_warnings_step.hasWarnings'
  checkBuildWarningStepResultOnWarnings: 'SucceededWithIssues'

jobs:
  - job: CheckBuildWarningsEmpty
    displayName: 'Check build warnings (empty)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepResultOnWarnings: 'Failed'

      - template: '../../../../../azuredevops/build/check-output-variable.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          variableDisplayName: ${{ variables.checkBuildWarningHasWarningsOutputVariable }}
          variableValue: $(${{ variables.checkBuildWarningHasWarningsOutputVariable }})
          expectedValue: 'false'
          stepResultOnMismatch: 'Failed'

  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - CheckBuildWarningsEmpty
    steps:
      - checkout: none

      - bash: |
          echo "##vso[task.logissue type=warning]Test warning message."
        displayName: 'Set build warning'

  - job: CheckBuildWarningsExist
    displayName: 'Check build warnings (exist)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-build-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepResultOnWarnings: ${{ variables.checkBuildWarningStepResultOnWarnings }}

  - template: '../../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - CheckBuildWarningsExist
      expectedBuildResult: 'Canceled'
      outputVariables:
        - displayName: "dependencies.CheckBuildWarningsExist.outputs['${{ variables.checkBuildWarningHasWarningsOutputVariable }}']"
          value: $[ dependencies.CheckBuildWarningsExist.outputs['${{ variables.checkBuildWarningHasWarningsOutputVariable }}'] ]
          expectedValue: 'true'
      buildResultDescription: |
        Job **'Check build warnings (exist)'**
        Step **'Check for build warnings'** result must be: **${{ variables.checkBuildWarningStepResultOnWarnings }}**
      warningThreshold: 1
      cancelBuildCondition: |
        and
        (
          succeeded(),
          eq($[ dependencies.CheckBuildWarningsExist.result ], 'SucceededWithIssues'),
          eq($[ dependencies.CheckBuildWarningsExist.outputs['${{ variables.checkBuildWarningHasWarningsOutputVariable }}']], 'true')
        )
