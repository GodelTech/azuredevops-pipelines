# test-azuredevops-build-quality-check-job-warnings.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-job-warnings.test.yml
      - azuredevops/build/quality/check-job-warnings.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/azuredevops/build/quality/check-job-warnings.test.yml
      - azuredevops/build/quality/check-job-warnings.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: SetBuildWarning
    displayName: 'Set build warning'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - script: |
          echo "##vso[task.logissue type=warning]Test warning message (SetBuildWarning)."
        displayName: 'Set build warning'

  - job: CheckBuildWarnings
    displayName: 'Check build warnings'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - SetBuildWarning
    steps:
      - checkout: none

      - template: '../../../../../azuredevops/build/quality/check-job-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}

  - job: SetAndCheckBuildWarnings
    displayName: 'Set and check build warnings'
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn:
      - CheckBuildWarnings
    steps:
      - checkout: none

      - script: |
          echo "##vso[task.logissue type=warning]Test warning message (SetAndCheckBuildWarnings)."
        displayName: 'Set build warning'

      - template: '../../../../../azuredevops/build/quality/check-job-warnings.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}

  - template: '../../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - SetAndCheckBuildWarnings
      variables:
        setAndCheckBuildWarningsResult: $[ dependencies.SetAndCheckBuildWarnings.result ]
      expectedBuildResult: 'Canceled'
      buildResultDescription: |
        Job **'Set and check build warnings'**
        Step **'Warnings quality check'** result must be: **Failed**
      warningThreshold: 4
      cancelBuildCondition: |
        eq(variables['setAndCheckBuildWarningsResult'], 'Failed')
