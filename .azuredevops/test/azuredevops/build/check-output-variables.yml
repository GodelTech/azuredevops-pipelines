# test-azuredevops-build-check-output-variables.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger: none

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

stages:
- stage: A
  displayName: 'Stage: A'
  jobs:
    - job: SetOutputVariable
      displayName: 'Set output variable'
      pool:
        vmImage: ${{ parameters.vmImage }}
      steps:
        - checkout: none

        - bash: |
            echo "##vso[task.setvariable variable=testOutputA;isOutput=true]testValueA"
            echo "Set output variable 'testOutputA' to: $(testOutputA)'"
          displayName: 'Set output variable ''testOutputA'''
          name: set_output_variable_step

        - template: '../../../../azuredevops/build/check-output-variables.yml'
          parameters:
            enableBuildDebug: ${{ parameters.enableBuildDebug }}
            variableName: 'set_output_variable_step.testOutputA'
            variableValue: '$(set_output_variable_step.testOutputA)'
            expectedValue: 'testValueA'
            stepResult: 'Failed'
