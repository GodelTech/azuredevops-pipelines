# test-azuredevops-build-check-output-variables.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/azuredevops/build/check-output-variables.yml
      - azuredevops/build/check-output-variables.yml
      - .azuredevops/testHelpers/upload-build-summary.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

stages:
  - stage: FirstStage
    displayName: 'First stage'
    jobs:
      - job: SetOutputVariable
        displayName: 'Set output variable'
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - checkout: none

          - bash: |
              echo "##vso[task.setvariable variable=testOutput;isOutput=true]testValue"
            displayName: 'Set output variable "testOutput"'
            name: set_output_variable_step

          - bash: |
              echo "Output variable 'testOutput': $(set_output_variable_step.testOutput)"
            displayName: 'Show output variable "testOutput"'

          - template: '../../../../azuredevops/build/check-output-variables.yml'
            parameters:
              enableBuildDebug: ${{ parameters.enableBuildDebug }}
              variableName: 'testOutput'
              variableValue: $(set_output_variable_step.testOutput)
              expectedValue: 'testValue'
              stepResultOnMismatch: 'Failed'

          - template: '../../../../.azuredevops/testHelpers/upload-build-summary.yml'
            parameters:
              enableBuildDebug: ${{ parameters.enableBuildDebug }}
              expectedBuildResult: 'Succeeded'
              buildResultDescription: |
                Job **'$(Agent.JobName)'**
                Step **Check output variable: "testOutput"** result must be: **Succeeded**
              outputVariables:
                - name: 'testOutput'
                  value: $(set_output_variable_step.testOutput)
                  expectedValue: 'testValue'
                  stepResultOnMismatch: 'Failed'
