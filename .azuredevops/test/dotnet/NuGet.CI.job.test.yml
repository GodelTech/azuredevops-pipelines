# test-dotnet-NuGet.CI.job.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: sonarCloud
    displayName: 'SonarCloud parameters'
    type: object
    # prettier-ignore
    default: {
      enable: true,
      serviceConnection: 'SonarCloud',
      organization: 'godeltech',
      projectKey: 'GodelTech_azuredevops-pipelines_test_dotnet_NuGet_CI_job',
      projectName: 'azuredevops-pipelines test dotnet NuGet.CI.job',
      coverageReportPath: '$(Agent.TempDirectory)/**/coverage.opencover.xml'
    }

  - name: dotnet
    displayName: '.NET parameters'
    type: object
    default: {}

  - name: stryker
    displayName: 'Stryker mutation testing parameters'
    type: object
    default: {}

  - name: quality
    displayName: 'Quality check parameters'
    type: object
    # prettier-ignore
    default: {
      stryker: {
        # Known issue: Stryker.NET does not support xUnit v3. Projects using xUnit v3 will show most mutants
        # as 'not covered' or 'survived' with incorrect results.
        # Track progress at https://github.com/stryker-mutator/stryker-net/issues/3117
        enable: false
      },
      jobWarnings: {
        # Known issue: branchCoverage and methodCoverage checks currently report 0% covered due to limitations in PublishCodeCoverageResults@2,
        # so set warning threshold low to avoid unnecessarily failing the build.
        warningThreshold: 2
      }
    }

  - name: pack
    displayName: 'NuGet pack parameters'
    type: object
    # prettier-ignore
    default: {
      enable: true,
      includesSymbols: true
    }

  - name: push
    displayName: 'NuGet push parameters'
    type: object
    # prettier-ignore
    default: {
      enable: false
    }

  - name: buildSummary
    displayName: 'Build summary parameters'
    type: object
    default: {}

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-nuget'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/NuGet.CI.job.test.yml
      - dotnet/NuGet.CI.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/dotnet/NuGet.CI.job.test.yml
      - dotnet/NuGet.CI.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

variables:
  buildJobName: 'Pack'

jobs:
  - template: '../../../dotnet/NuGet.CI.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      sonarCloud: ${{ parameters.sonarCloud }}
      dotnet: ${{ parameters.dotnet }}
      stryker: ${{ parameters.stryker }}
      quality: ${{ parameters.quality }}
      pack: ${{ parameters.pack }}
      push: ${{ parameters.push }}
      buildSummary: ${{ parameters.buildSummary }}
      workingDirectory: ${{ parameters.workingDirectory }}

  - template: '../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - ${{ variables.buildJobName }}
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'${{ variables.buildJobName }}'** result must be: **Succeeded**
      # Known issue: branchCoverage and methodCoverage checks currently report 0% covered due to limitations in PublishCodeCoverageResults@2,
      # so set warning threshold low to avoid unnecessarily failing the build.
      warningThreshold: 2
