# test-dotnet-build.job.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/build.job.yml
      - dotnet/build.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - template: '../../../dotnet/build.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: BuildDotnetDefaults
      jobDisplayName: 'Build .NET with defaults'
      vmImage: ${{ parameters.vmImage }}

  - template: '../../../dotnet/build.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: BuildDotnetWithWorkingDirectory
      jobDisplayName: 'Build .NET with custom working directory'
      vmImage: ${{ parameters.vmImage }}
      dotnet:
        workingDirectory: '$(Build.SourcesDirectory)'

  - template: '../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - BuildDotnetDefaults
        - BuildDotnetWithWorkingDirectory
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Build .NET with defaults'**
        Step **'Use .NET SDK'** result must be: **Succeeded**

        Job **'Build .NET with custom working directory'**
        Step **'Use .NET SDK'** result must be: **Succeeded**
