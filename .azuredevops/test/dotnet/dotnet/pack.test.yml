# test-dotnet-dotnet-pack.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-nuget'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/dotnet/pack.test.yml
      - dotnet/dotnet/restore-and-build.yml
      - dotnet/dotnet/pack.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/dotnet/dotnet/pack.test.yml
      - dotnet/dotnet/restore-and-build.yml
      - dotnet/dotnet/pack.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: DotnetPack
    displayName: 'dotnet pack'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - template: '../../../../dotnet/dotnet/restore-and-build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/dotnet/pack.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

  - template: '../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - DotnetPack
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'dotnet pack'** result must be: **Succeeded**
