# test-dotnet-dotnet-install-SDK.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-core'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/dotnet/install-SDK.yml
      - dotnet/dotnet/install-SDK.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: InstallSDKFromGlobalJson
    displayName: 'Install .NET SDK from global.json'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - pwsh: |
          $workingDirectory = $env:WORKING_DIRECTORY

          Copy-Item "$workingDirectory/global.json" `
            -Destination '$(Build.SourcesDirectory)/global.json' `
            -Force
        displayName: 'Copy global.json to $(Build.SourcesDirectory)'
        env:
          WORKING_DIRECTORY: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}

  - job: InstallSDKFromGlobalJsonWithWorkingDirectory
    displayName: 'Install .NET SDK from global.json with working directory'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - template: '../../../../dotnet/dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

  - job: InstallSDKVersions
    displayName: 'Install .NET SDK versions'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - template: '../../../../dotnet/dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          versions:
            - '8.x'
            - '9.x'

  - template: '../../../testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - InstallSDKFromGlobalJson
        - InstallSDKFromGlobalJsonWithWorkingDirectory
        - InstallSDKVersions
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Install .NET SDK from global.json'**
        Step **'Use .NET SDK from global.json'** result must be: **Succeeded**

        Job **'Install .NET SDK from global.json with working directory'**
        Step **'Use .NET SDK from global.json'** result must be: **Succeeded**

        Job **'Install .NET SDK versions'**
        Step **'Use .NET Core SDK "8.x"'** result must be: **Succeeded**
        Step **'Use .NET Core SDK "9.x"'** result must be: **Succeeded**
