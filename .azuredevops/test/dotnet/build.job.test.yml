# test-dotnet-build.job.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: sonarCloud
    displayName: 'SonarCloud parameters'
    type: object
    # prettier-ignore
    default: {
      enable: true,
      serviceConnection: 'SonarCloud',
      organization: 'godeltech',
      projectKey: 'GodelTech_azuredevops-pipelines_test_dotnet_build_job',
      projectName: 'azuredevops-pipelines test dotnet build.job',
      coverageReportPath: '$(Agent.TempDirectory)/**/coverage.opencover.xml'
    }

  - name: dotnet
    displayName: '.NET parameters'
    type: object
    default: {}

  - name: stryker
    displayName: 'Stryker mutation testing parameters'
    type: object
    default: {}

  - name: quality
    displayName: 'Quality check parameters'
    type: object
    # prettier-ignore
    default: {
      stryker: {
        enable: false
      },
      jobWarnings: {
        warningThreshold: 1
      }
    }

  - name: buildSummary
    displayName: 'Build summary parameters'
    type: object
    default: {}

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-core'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/build.job.test.yml
      - dotnet/build.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/dotnet/build.job.test.yml
      - dotnet/build.job.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - template: '../../../dotnet/build.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      jobName: BuildDotnetDummyProject
      jobDisplayName: 'Build .NET dummy project'
      vmImage: ${{ parameters.vmImage }}
      sonarCloud: ${{ parameters.sonarCloud }}
      dotnet: ${{ parameters.dotnet }}
      stryker: ${{ parameters.stryker }}
      quality: ${{ parameters.quality }}
      buildSummary: ${{ parameters.buildSummary }}
      workingDirectory: ${{ parameters.workingDirectory }}

  - template: '../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - BuildDotnetDummyProject
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Build .NET dummy project'** result must be: **Succeeded**
