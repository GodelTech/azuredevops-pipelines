# test-dotnet-NuGet-check-packages-check-vulnerable.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-core'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/NuGet/check-packages/check-vulnerable.test.yml
      - dotnet/dotnet/install-SDK.yml
      - dotnet/dotnet/restore.yml
      - dotnet/NuGet/check-packages/check-vulnerable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/dotnet/NuGet/check-packages/check-vulnerable.test.yml
      - dotnet/dotnet/install-SDK.yml
      - dotnet/dotnet/restore.yml
      - dotnet/NuGet/check-packages/check-vulnerable.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: CheckVulnerablePackages
    displayName: 'Check NuGet vulnerable packages'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - template: '../../../../../dotnet/dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../../dotnet/dotnet/restore.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../../dotnet/NuGet/check-packages/check-vulnerable.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

  - template: '../../../../testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - CheckVulnerablePackages
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Check NuGet vulnerable packages'** result must be: **Succeeded**
