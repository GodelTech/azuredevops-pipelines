# test-dotnet-NuGet-authenticate.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/NuGet/authenticate.test.yml
      - dotnet/NuGet/authenticate.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: NuGetAuthenticate
    displayName: 'NuGet authenticate (no service connections)'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: none

      - template: '../../../../dotnet/NuGet/authenticate.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}

  - template: '../../../testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - NuGetAuthenticate
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'NuGet authenticate (no service connections)'** result must be: **Succeeded**
