# test-dotnet-SonarCloud-analyze.test.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: true

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'
    values:
      - windows-latest
      - ubuntu-latest
      - macOS-latest

  - name: serviceConnection
    displayName: 'SonarCloud service connection name'
    type: string
    default: 'SonarCloud'

  - name: organization
    displayName: 'SonarCloud organization'
    type: string
    default: 'godeltech'

  - name: projectKey
    displayName: 'SonarCloud project key'
    type: string
    default: 'GodelTech_azuredevops-pipelines_test_dotnet_SonarCloud_analyze'

  - name: projectName
    displayName: 'SonarCloud project name'
    type: string
    default: 'azuredevops-pipelines test dotnet SonarCloud analyze'

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: '$(Build.SourcesDirectory)/.azuredevops/dummy-projects/dotnet/dotnet-core'

trigger:
  batch: true
  paths:
    include:
      - .azuredevops/test/dotnet/SonarCloud/analyze.test.yml
      - dotnet/SonarCloud/analyze.yml
      - dotnet/SonarCloud/prepare.yml
      - dotnet/dotnet/install-SDK.yml
      - dotnet/dotnet/restore.yml
      - dotnet/dotnet/build.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

pr:
  branches:
    include:
      - '*'
  paths:
    include:
      - .azuredevops/test/dotnet/SonarCloud/analyze.test.yml
      - dotnet/SonarCloud/analyze.yml
      - dotnet/SonarCloud/prepare.yml
      - dotnet/dotnet/install-SDK.yml
      - dotnet/dotnet/restore.yml
      - dotnet/dotnet/build.yml
      - .azuredevops/testHelpers/build-summary-validation.job.yml

schedules:
  - cron: '0 0 1 * *'
    displayName: 'Monthly check'
    branches:
      include:
        - main
    always: true

jobs:
  - job: AnalyzeSonarCloud
    displayName: 'Analyze SonarCloud'
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - template: '../../../../dotnet/SonarCloud/prepare.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          enable: true
          serviceConnection: ${{ parameters.serviceConnection }}
          organization: ${{ parameters.organization }}
          projectKey: ${{ parameters.projectKey }}
          projectName: ${{ parameters.projectName }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/dotnet/restore.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/dotnet/build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../../../../dotnet/SonarCloud/analyze.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          enable: true

  - template: '../../../../.azuredevops/testHelpers/build-summary-validation.job.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      vmImage: ${{ parameters.vmImage }}
      dependsOn:
        - AnalyzeSonarCloud
      expectedBuildResult: 'Succeeded'
      buildResultDescription: |
        Job **'Analyze SonarCloud'**
        Step **'Run SonarCloud analysis'** result must be: **Succeeded**
        Step **'Publish SonarCloud quality gate result'** result must be: **Succeeded**
