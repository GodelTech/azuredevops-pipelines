# Known issue: Stryker.NET does not support xUnit v3. Projects using xUnit v3 will show most mutants
# as 'not covered' or 'survived' with incorrect results.
# Track progress at https://github.com/stryker-mutator/stryker-net/issues/3117
parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable Stryker mutation testing'
    type: boolean
    default: true

  - name: version
    displayName: 'dotnet-stryker version to install (empty = latest)'
    type: string
    default: ''

  - name: project
    displayName: 'Project under test (source project path)'
    type: string
    default: ''

  - name: configuration
    displayName: 'Build configuration'
    type: string
    default: 'Release'

  - name: thresholdHigh
    displayName: 'Mutation score threshold (high)'
    type: number
    default: 80

  - name: thresholdLow
    displayName: 'Mutation score threshold (low)'
    type: number
    default: 60

  - name: breakAt
    displayName: 'Break at mutation score'
    type: number
    default: 0

  - name: mutationLevel
    displayName: 'Mutation level'
    type: string
    default: 'Standard'
    values:
      - Basic
      - Standard
      - Advanced
      - Complete

  - name: publishReport
    displayName: 'Publish Stryker report as pipeline artifact and build tab'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the report'
    type: string
    default: 'stryker-report'

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $version = $env:STRYKER_VERSION

      if ($enableBuildDebug) {
        $versionInfo = if ($version) { "version $version" } else { 'latest version' }
        Write-Host "##[debug]Installing dotnet-stryker ($versionInfo)"
      }

      $installArgs = @('tool', 'install', 'dotnet-stryker', '--global')
      if ($version) {
        $installArgs += '--version'
        $installArgs += $version
      }

      & dotnet @installArgs
    displayName: 'Install dotnet-stryker'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      STRYKER_VERSION: ${{ parameters.version }}

  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $project = $env:PROJECT
      $configuration = $env:CONFIGURATION
      $thresholdHigh = $env:THRESHOLD_HIGH
      $thresholdLow = $env:THRESHOLD_LOW
      $breakAt = $env:BREAK_AT
      $mutationLevel = $env:MUTATION_LEVEL
      $agentTempDirectory = $env:AGENT_TEMPDIRECTORY

      $strykerArgs = @('--output', "$agentTempDirectory/stryker-output")
      if ($project) {
        $strykerArgs += '--project'
        $strykerArgs += $project
      }
      if ($configuration) {
        $strykerArgs += '--configuration'
        $strykerArgs += $configuration
      }
      $strykerArgs += '--threshold-high'
      $strykerArgs += $thresholdHigh
      $strykerArgs += '--threshold-low'
      $strykerArgs += $thresholdLow
      $strykerArgs += '--break-at'
      $strykerArgs += $breakAt
      if ($mutationLevel) {
        $strykerArgs += '--mutation-level'
        $strykerArgs += $mutationLevel
      }
      $strykerArgs += '--reporter'
      $strykerArgs += 'json'
      $strykerArgs += '--reporter'
      $strykerArgs += 'html'
      $strykerArgs += '--reporter'
      $strykerArgs += 'progress'

      if ($enableBuildDebug) {
        Write-Host "##[debug]dotnet stryker arguments: $($strykerArgs -join ' ')"
      }

      & dotnet stryker @strykerArgs
    displayName: 'dotnet stryker'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    ${{ if ne(parameters.workingDirectory, '') }}:
      workingDirectory: ${{ parameters.workingDirectory }}
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      PROJECT: ${{ parameters.project }}
      CONFIGURATION: ${{ parameters.configuration }}
      THRESHOLD_HIGH: ${{ parameters.thresholdHigh }}
      THRESHOLD_LOW: ${{ parameters.thresholdLow }}
      BREAK_AT: ${{ parameters.breakAt }}
      MUTATION_LEVEL: ${{ parameters.mutationLevel }}
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)

  - publish: '$(Agent.TempDirectory)/stryker-output'
    displayName: 'Publish Stryker report'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.enable }}, true),
        eq(${{ parameters.publishReport }}, true)
      )
    artifact: ${{ parameters.artifactName }}

  - task: PublishMutationReport@2
    displayName: 'Publish Stryker mutation report tab'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.enable }}, true),
        eq(${{ parameters.publishReport }}, true)
      )
    inputs:
      reportPattern: '$(Agent.TempDirectory)/stryker-output/reports/mutation-report.html'
      reportDisplayName: ${{ parameters.artifactName }}

  - template: '../../azuredevops/build/append-to-job-summary.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      stepDisplayName: 'Append Stryker section to job summary'
      condition: |
        and
        (
          succeededOrFailed(),
          eq(${{ parameters.enable }}, true),
          eq(${{ parameters.appendSummary }}, true)
        )
      title: 'Stryker Mutation Testing'
      contentBlocks:
        - ${{ if parameters.publishReport }}:
            # yamllint disable rule:line-length
            content: |
              Mutation report tab: [**view**]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=stryker-mutator.mutation-report-publisher.mutation-report-tab)
              Report artifact: [**${{ parameters.artifactName }}**]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts)
            # yamllint enable rule:line-length
          ${{ else }}:
            content: '_Report artifact publishing is disabled._'
