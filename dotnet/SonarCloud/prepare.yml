# source: https://github.com/SonarSource/sonar-scanner-azdo/blob/master/its/fixtures/pipeline-sonarcloud-v4-dotnet-embedded-unix.yml

parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable SonarCloud analysis'
    type: boolean
    default: true

  - name: serviceConnection
    displayName: 'SonarCloud service connection name'
    type: string
    default: 'SonarCloud'

  - name: organization
    displayName: 'SonarCloud organization'
    type: string
    default: ''

  - name: projectKey
    displayName: 'SonarCloud project key'
    type: string
    default: ''

  - name: projectName
    displayName: 'SonarCloud project name'
    type: string
    default: ''

  - name: coverageReportPath
    displayName: 'Coverage report path'
    type: string
    default: '$(Agent.TempDirectory)/**/coverage.opencover.xml'
    # Note: SonarCloud requires OpenCover format. Ensure your .runsettings file includes
    # <Format>opencover</Format> (or cobertura,opencover) in the coverlet configuration.

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - task: SonarCloudPrepare@4
    displayName: 'Prepare SonarCloud analysis'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    inputs:
      SonarCloud: ${{ parameters.serviceConnection }}
      organization: ${{ parameters.organization }}
      scannerMode: 'dotnet'
      projectKey: ${{ parameters.projectKey }}
      projectName: ${{ parameters.projectName }}
      # https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/analysis-parameters/parameters-not-settable-in-ui
      # https://docs.sonarsource.com/sonarqube-cloud/enriching/test-coverage/dotnet-test-coverage
      # Note: coverage.opencover.xml is only generated when runSettingsFile is passed to dotnet/test.yml
      # with <Format>opencover</Format> (or cobertura,opencover) in the coverlet configuration.
      ${{ if eq(parameters.workingDirectory, '') }}:
        extraProperties: |
          sonar.cs.opencover.reportsPaths=${{ parameters.coverageReportPath }}
      ${{ else }}:
        extraProperties: |
          sonar.cs.opencover.reportsPaths=${{ parameters.coverageReportPath }}
          sonar.projectBaseDir=${{ parameters.workingDirectory }}
