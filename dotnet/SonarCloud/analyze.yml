parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable SonarCloud analysis'
    type: boolean
    default: true

  - name: pollingTimeoutSec
    displayName: 'Polling timeout in seconds'
    type: number
    default: 300

steps:
  - task: SonarCloudAnalyze@4
    displayName: 'Run SonarCloud analysis'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )

  - task: SonarCloudPublish@4
    displayName: 'Publish SonarCloud quality gate result'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    inputs:
      pollingTimeoutSec: ${{ parameters.pollingTimeoutSec }}
