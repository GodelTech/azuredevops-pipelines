parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable dotnet format'
    type: boolean
    default: true

  - name: noRestore
    displayName: 'Do not restore packages before formatting'
    type: boolean
    default: true

  - name: publishReport
    displayName: 'Publish dotnet format report as pipeline artifact'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the report'
    type: string
    default: 'dotnet-format-report'

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $noRestore = [System.Convert]::ToBoolean($env:NO_RESTORE)
      $publishReport = [System.Convert]::ToBoolean($env:PUBLISH_REPORT)
      $artifactStagingDirectory = $env:BUILD_ARTIFACTSTAGINGDIRECTORY

      $formatArgs = '--verify-no-changes'
      if ($noRestore) { $formatArgs += ' --no-restore' }
      if ($publishReport) {
        $reportDir = "$artifactStagingDirectory/dotnet-reports"
        New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
        $formatArgs += " --report `"$reportDir/format-report.json`""
      }

      if ($enableBuildDebug) {
        Write-Host "##[debug]dotnet format arguments: $formatArgs"
      }

      Write-Host "##vso[task.setvariable variable=dotnetFormatArguments]$formatArgs"
    displayName: 'Set dotnet format arguments'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      NO_RESTORE: ${{ parameters.noRestore }}
      PUBLISH_REPORT: ${{ parameters.publishReport }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: $(Build.ArtifactStagingDirectory)

  - task: DotNetCoreCLI@2
    displayName: 'dotnet format'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    inputs:
      command: 'custom'
      custom: 'format'
      arguments: $(dotnetFormatArguments)
      ${{ if ne(parameters.workingDirectory, '') }}:
        workingDirectory: ${{ parameters.workingDirectory }}

  - publish: '$(Build.ArtifactStagingDirectory)/dotnet-reports/format-report.json'
    displayName: 'Publish format report'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.enable }}, true),
        eq(${{ parameters.publishReport }}, true)
      )
    artifact: ${{ parameters.artifactName }}

  - template: '../../azuredevops/build/append-to-job-summary.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      stepDisplayName: 'Append code format section to job summary'
      condition: |
        and
        (
          succeededOrFailed(),
          eq(${{ parameters.enable }}, true),
          eq(${{ parameters.appendSummary }}, true)
        )
      title: 'Code Format'
      contentBlocks:
        - ${{ if parameters.publishReport }}:
            # yamllint disable rule:line-length
            content: 'Report artifact: [**${{ parameters.artifactName }}**]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts)'
            # yamllint enable rule:line-length
          ${{ else }}:
            content: '_Report artifact publishing is disabled._'
