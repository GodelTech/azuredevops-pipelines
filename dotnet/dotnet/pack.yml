parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable dotnet pack'
    type: boolean
    default: true

  - name: projects
    displayName: 'Projects to pack'
    type: string
    default: '**/*.csproj'

  - name: configuration
    displayName: 'Build configuration'
    type: string
    default: 'Release'

  - name: verbosity
    displayName: 'MSBuild verbosity level'
    type: string
    default: 'Minimal'
    values:
      - '-'
      - Quiet
      - Minimal
      - Normal
      - Detailed
      - Diagnostic

  - name: versioningScheme
    displayName: 'Versioning scheme'
    type: string
    default: 'off'
    values:
      - 'off'
      - byPrereleaseNumber
      - byEnvVar
      - byBuildNumber
      - bySemVerBuildNumber

  - name: versionEnvVar
    displayName: 'Pipeline variable name holding the version (used when versioningScheme is byEnvVar)'
    type: string
    default: ''

  - name: majorVersion
    displayName: 'Major version (used when versioningScheme is byPrereleaseNumber)'
    type: string
    default: '1'

  - name: minorVersion
    displayName: 'Minor version (used when versioningScheme is byPrereleaseNumber)'
    type: string
    default: '0'

  - name: patchVersion
    displayName: 'Patch version (used when versioningScheme is byPrereleaseNumber)'
    type: string
    default: '0'

  - name: noBuild
    displayName: 'Do not build the project before packing'
    type: boolean
    default: true

  - name: includesSymbols
    displayName: 'Include symbol packages (.snupkg)'
    type: boolean
    default: true

  - name: outputDir
    displayName: 'Output directory for NuGet packages'
    type: string
    default: '$(Build.ArtifactStagingDirectory)/nuget'

  - name: publishPackages
    displayName: 'Publish NuGet packages as pipeline artifact'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the NuGet packages'
    type: string
    default: 'nuget-packages'

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - task: DotNetCoreCLI@2
    displayName: 'dotnet pack'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    inputs:
      command: 'pack'
      ${{ if ne(parameters.workingDirectory, '') }}:
        packagesToPack: ${{ parameters.workingDirectory }}/${{ parameters.projects }}
        workingDirectory: ${{ parameters.workingDirectory }}
      ${{ else }}:
        packagesToPack: ${{ parameters.projects }}
      configurationToPack: ${{ parameters.configuration }}
      outputDir: ${{ parameters.outputDir }}
      nobuild: ${{ parameters.noBuild }}
      includesymbols: ${{ parameters.includesSymbols }}
      verbosityPack: ${{ parameters.verbosity }}
      versioningScheme: ${{ parameters.versioningScheme }}
      ${{ if eq(parameters.versioningScheme, 'byEnvVar') }}:
        versionEnvVar: ${{ parameters.versionEnvVar }}
      ${{ if eq(parameters.versioningScheme, 'byPrereleaseNumber') }}:
        majorVersion: ${{ parameters.majorVersion }}
        minorVersion: ${{ parameters.minorVersion }}
        patchVersion: ${{ parameters.patchVersion }}
      ${{ if eq(parameters.includesSymbols, true) }}:
        buildProperties: 'SymbolPackageFormat=snupkg'

  - publish: '${{ parameters.outputDir }}'
    displayName: 'Publish NuGet packages artifact'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true),
        eq(${{ parameters.publishPackages }}, true)
      )
    artifact: ${{ parameters.artifactName }}

  - template: '../../azuredevops/build/append-to-job-summary.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      stepDisplayName: 'Append .NET pack section to job summary'
      condition: |
        and
        (
          succeededOrFailed(),
          eq(${{ parameters.enable }}, true),
          eq(${{ parameters.appendSummary }}, true)
        )
      title: '.NET Pack'
      content: |
        | Property | Value |
        | --- | --- |
        | Configuration | ${{ parameters.configuration }} |
        | Versioning Scheme | ${{ parameters.versioningScheme }} |
      noNewLine: true
      contentBlocks:
        - ${{ if eq(parameters.versioningScheme, 'byEnvVar') }}:
            content: '| Version | $(${{ parameters.versionEnvVar }}) |'
          ${{ elseif eq(parameters.versioningScheme, 'byPrereleaseNumber') }}:
            content: '| Version | ${{ parameters.majorVersion }}.${{ parameters.minorVersion }}.${{ parameters.patchVersion }}-CI.* |'
          ${{ elseif in(parameters.versioningScheme, 'byBuildNumber', 'bySemVerBuildNumber') }}:
            content: '| Version | $(Build.BuildNumber) |'
          ${{ else }}:
            content: '| Version | _N/A (scheme: off)_ |'
        - ${{ if parameters.publishPackages }}:
            # yamllint disable rule:line-length
            content: 'NuGet packages artifact: [**${{ parameters.artifactName }}**]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts)'
            # yamllint enable rule:line-length
          ${{ else }}:
            content: '_NuGet packages artifact publishing is disabled._'
