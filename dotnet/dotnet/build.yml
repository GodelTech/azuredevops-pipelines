parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: projects
    displayName: 'Projects to build'
    type: string
    default: ''

  - name: configuration
    displayName: 'Build configuration'
    type: string
    default: 'Release'

  - name: verbosity
    displayName: 'MSBuild verbosity level'
    type: string
    default: 'minimal'
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

  - name: noRestore
    displayName: 'Do not restore packages before building'
    type: boolean
    default: true

  - name: selfContained
    displayName: 'Publish the .NET runtime with the application'
    type: boolean
    default: false

  - name: publishBinlog
    displayName: 'Publish MSBuild binary log as pipeline artifact'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the binary log'
    type: string
    default: 'dotnet-build-binlog'

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - pwsh: |
      $noRestore = [System.Convert]::ToBoolean($env:NO_RESTORE)
      $selfContained = [System.Convert]::ToBoolean($env:SELF_CONTAINED)
      $publishBinlog = [System.Convert]::ToBoolean($env:PUBLISH_BINLOG)

      $args = "--configuration ${{ parameters.configuration }}"
      $args += " --verbosity ${{ parameters.verbosity }}"
      if ($noRestore) { $args += " --no-restore" }
      if ($selfContained) { $args += " --self-contained" }
      if ($publishBinlog) {
        $binlogDir = "$(Agent.TempDirectory)/dotnet-reports"
        New-Item -ItemType Directory -Force -Path $binlogDir | Out-Null
        $args += " -bl:`"$binlogDir/msbuild.binlog`""
      }

      Write-Host "##vso[task.setvariable variable=dotnetBuildArguments]$args"
    displayName: 'Set dotnet build arguments'
    env:
      NO_RESTORE: ${{ parameters.noRestore }}
      SELF_CONTAINED: ${{ parameters.selfContained }}
      PUBLISH_BINLOG: ${{ parameters.publishBinlog }}

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      ${{ if ne(parameters.projects, '') }}:
        projects: ${{ parameters.projects }}
      arguments: $(dotnetBuildArguments)
      ${{ if ne(parameters.workingDirectory, '') }}:
        workingDirectory: ${{ parameters.workingDirectory }}

  - pwsh: |
      $artifactName = $env:ARTIFACT_NAME
      $binlogPath = "$(Agent.TempDirectory)/dotnet-reports/msbuild.binlog"
      Write-Host "##vso[artifact.upload containerfolder=$artifactName;artifactname=$artifactName]$binlogPath"
    displayName: 'Publish build binary log'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.publishBinlog }}, true)
      )
    env:
      ARTIFACT_NAME: ${{ parameters.artifactName }}
