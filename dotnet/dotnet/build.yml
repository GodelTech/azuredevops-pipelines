parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: projects
    displayName: 'Projects to build'
    type: string
    default: ''

  - name: configuration
    displayName: 'Build configuration'
    type: string
    default: 'Release'

  - name: verbosity
    displayName: 'MSBuild verbosity level'
    type: string
    default: 'minimal'
    values:
      - quiet
      - minimal
      - normal
      - detailed
      - diagnostic

  - name: noRestore
    displayName: 'Do not restore packages before building'
    type: boolean
    default: true

  - name: selfContained
    displayName: 'Publish the .NET runtime with the application'
    type: boolean
    default: false

  - name: publishBinlog
    displayName: 'Publish MSBuild binary log as pipeline artifact'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the binary log'
    type: string
    default: 'dotnet-build-binlog'

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - pwsh: |
      $noRestore = [System.Convert]::ToBoolean($env:NO_RESTORE)
      $selfContained = [System.Convert]::ToBoolean($env:SELF_CONTAINED)
      $publishBinlog = [System.Convert]::ToBoolean($env:PUBLISH_BINLOG)

      $buildArgs = "--configuration ${{ parameters.configuration }}"
      $buildArgs += " --verbosity ${{ parameters.verbosity }}"
      if ($noRestore) { $buildArgs += " --no-restore" }
      if ($selfContained) { $buildArgs += " --self-contained" }
      if ($publishBinlog) {
        $binlogDir = "$(Build.ArtifactStagingDirectory)/dotnet-reports"
        New-Item -ItemType Directory -Force -Path $binlogDir | Out-Null
        $buildArgs += " -bl:`"$binlogDir/msbuild.binlog`""
      }

      Write-Host "##vso[task.setvariable variable=dotnetBuildArguments]$buildArgs"
    displayName: 'Set dotnet build arguments'
    env:
      NO_RESTORE: ${{ parameters.noRestore }}
      SELF_CONTAINED: ${{ parameters.selfContained }}
      PUBLISH_BINLOG: ${{ parameters.publishBinlog }}

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      ${{ if ne(parameters.projects, '') }}:
        projects: ${{ parameters.projects }}
      arguments: $(dotnetBuildArguments)
      ${{ if ne(parameters.workingDirectory, '') }}:
        workingDirectory: ${{ parameters.workingDirectory }}

  - template: '../../azuredevops/build/append-to-job-summary.yml'
    parameters:
      stepDisplayName: 'Append .NET build section to job summary'
      condition: |
        and
        (
          succeededOrFailed(),
          eq(${{ parameters.appendSummary }}, true)
        )
      title: '.NET Build'
      # yamllint disable rule:line-length
      content: |
        | Property | Value |
        | --- | --- |
        | Configuration | ${{ parameters.configuration }} |
        | Verbosity | ${{ parameters.verbosity }} |

        Binary log artifact: [**${{ parameters.artifactName }}**]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts) (published if publish binary log is enabled)
      # yamllint enable rule:line-length

  - publish: '$(Build.ArtifactStagingDirectory)/dotnet-reports/msbuild.binlog'
    displayName: 'Publish build binary log'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.publishBinlog }}, true)
      )
    artifact: ${{ parameters.artifactName }}
