parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: jobWarnings
    displayName: 'Parameters for job warnings check'
    type: object
    # prettier-ignore
    default: {
      enable: false,
      warningThreshold: 0,
      showStatistics: true
    }

  - name: coverageChecks
    displayName: 'Parameters for coverage threshold check'
    type: object
    default: {}

steps:
  - template: '../../azuredevops/build/quality/check-job-warnings.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      condition: |
        and
        (
          always(),
          eq(${{ parameters.jobWarnings.enable }}, true)
        )
      ${{ if ne(parameters.jobWarnings.warningThreshold, '') }}:
        warningThreshold: ${{ parameters.jobWarnings.warningThreshold }}
      ${{ if ne(parameters.jobWarnings.showStatistics, '') }}:
        showStatistics: ${{ parameters.jobWarnings.showStatistics }}

  - template: 'check-coverage.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      ${{ if ne(parameters.coverageChecks.lineCoverage, '') }}:
        lineCoverage: ${{ parameters.coverageChecks.lineCoverage }}
      ${{ if ne(parameters.coverageChecks.branchCoverage, '') }}:
        branchCoverage: ${{ parameters.coverageChecks.branchCoverage }}
      ${{ if ne(parameters.coverageChecks.methodCoverage, '') }}:
        methodCoverage: ${{ parameters.coverageChecks.methodCoverage }}
