parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: coverageChecks
    displayName: 'Parameters for coverage threshold check'
    type: object
    default: {}

  - name: sonarCloud
    displayName: 'Parameters for SonarCloud quality gate check'
    type: object
    default: {}

  - name: stryker
    displayName: 'Parameters for Stryker quality gate check'
    type: object
    default: {}

  - name: jobWarnings
    displayName: 'Parameters for job warnings check'
    type: object
    # prettier-ignore
    default: {
      enable: true,
      warningThreshold: 0,
      showStatistics: true
    }

steps:
  - template: 'check-coverage.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      ${{ if ne(parameters.coverageChecks.lineCoverage, '') }}:
        lineCoverage: ${{ parameters.coverageChecks.lineCoverage }}
      ${{ if ne(parameters.coverageChecks.branchCoverage, '') }}:
        branchCoverage: ${{ parameters.coverageChecks.branchCoverage }}
      ${{ if ne(parameters.coverageChecks.methodCoverage, '') }}:
        methodCoverage: ${{ parameters.coverageChecks.methodCoverage }}

  - template: '../SonarCloud/check-quality-gate.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      ${{ if ne(parameters.sonarCloud.enable, '') }}:
        enable: ${{ parameters.sonarCloud.enable }}
      ${{ if ne(parameters.sonarCloud.serviceConnection, '') }}:
        serviceConnection: ${{ parameters.sonarCloud.serviceConnection }}
      ${{ if ne(parameters.sonarCloud.organization, '') }}:
        organization: ${{ parameters.sonarCloud.organization }}

  - template: '../stryker/check-quality-gate.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      ${{ if ne(parameters.stryker.enable, '') }}:
        enable: ${{ parameters.stryker.enable }}
      ${{ if ne(parameters.stryker.breakAt, '') }}:
        breakAt: ${{ parameters.stryker.breakAt }}
      ${{ if ne(parameters.stryker.reportPath, '') }}:
        reportPath: ${{ parameters.stryker.reportPath }}

  - template: '../../azuredevops/build/quality/check-job-warnings.yml'
    parameters:
      enableBuildDebug: ${{ parameters.enableBuildDebug }}
      condition: |
        and
        (
          always(),
          ne(${{ coalesce(parameters.jobWarnings.enable, true) }}, false)
        )
      ${{ if ne(parameters.jobWarnings.warningThreshold, '') }}:
        warningThreshold: ${{ parameters.jobWarnings.warningThreshold }}
      ${{ if ne(parameters.jobWarnings.showStatistics, '') }}:
        showStatistics: ${{ parameters.jobWarnings.showStatistics }}
