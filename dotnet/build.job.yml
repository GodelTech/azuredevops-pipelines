parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: jobName
    displayName: 'Job name'
    type: string
    default: 'BuildDotnet'

  - name: jobDisplayName
    displayName: 'Job display name'
    type: string
    default: 'Build .NET'

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'

  - name: dependsOn
    displayName: 'Job depends on'
    type: object
    default: []

  - name: sonarCloud
    displayName: 'SonarCloud parameters'
    type: object
    default: {}
    # Example:
    # sonarCloud:
    #   enable: true
    #   serviceConnection: 'SonarCloud'
    #   organization: 'my-org'
    #   projectKey: 'my-project-key'
    #   projectName: 'My Project'
    #   coverageReportPath: '$(Agent.TempDirectory)/**/coverage.opencover.xml'

  - name: dotnet
    displayName: '.NET parameters'
    type: object
    default: {}
    # Example:
    # dotnet:
    #   nuGetServiceConnections:
    #     - 'my-nuget-feed'
    #   projects: '**/*.csproj'
    #   configuration: 'Release'
    #   verbosity: 'minimal'
    #   noRestore: true
    #   selfContained: false
    #   publishBinlog: true
    #   restore:
    #     enable: true
    #     useCache: true
    #   checks:
    #     publishReport: true
    #     codeFormatting:
    #       enable: true
    #     outdatedPackages:
    #       enable: true
    #       includePrerelease: false
    #       includeTransitive: true
    #       artifactName: 'nuget-outdated-report'
    #       stepResult: 'SucceededWithIssues'
    #       transitiveStepResult: 'Succeeded'
    #     deprecatedPackages:
    #       enable: true
    #       includeTransitive: true
    #       artifactName: 'nuget-deprecated-report'
    #       stepResult: 'Failed'
    #       transitiveStepResult: 'SucceededWithIssues'
    #     vulnerablePackages:
    #       enable: true
    #       includeTransitive: true
    #       artifactName: 'nuget-vulnerable-report'
    #       stepResult: 'Failed'
    #       transitiveStepResult: 'Failed'
    #   test:
    #     enable: true
    #     projects: '**/*Tests.csproj'
    #     noBuild: true
    #     publishTestResults: true
    #     testRunTitle: 'Unit Tests'
    #     runSettingsFile: '.runsettings'
    #     collectCoverage: false
    #     coverageReportPath: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

  - name: stryker
    displayName: 'Stryker mutation testing parameters'
    type: object
    default: {}
    # Example:
    # stryker:
    #   enable: true
    #   project: 'src/MyProject/MyProject.csproj'
    #   thresholdHigh: 80
    #   thresholdLow: 60
    #   thresholdBreak: 0
    #   mutationLevel: 'Standard'
    #   publishReport: true
    #   artifactName: 'stryker-report'

  - name: quality
    displayName: 'Quality check parameters'
    type: object
    default: {}
    # Example:
    # quality:
    #   jobWarnings:
    #     enable: true
    #     warningThreshold: 0
    #     showStatistics: true
    #   coverageChecks:
    #     lineCoverage:
    #       enable: true
    #       threshold: 80
    #     branchCoverage:
    #       enable: true
    #       threshold: 80
    #     methodCoverage:
    #       enable: true
    #       threshold: 80

  - name: buildSummary
    displayName: 'Build summary parameters'
    type: object
    default: {}
    # Example:
    # buildSummary:
    #   enable: true
    #   title: 'Build Summary'
    #   showSystemInfo: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobDisplayName }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn: ${{ parameters.dependsOn }}
    steps:
      - template: 'SonarCloud/prepare.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.sonarCloud.enable, '') }}:
            enable: ${{ parameters.sonarCloud.enable }}
          ${{ if ne(parameters.sonarCloud.serviceConnection, '') }}:
            serviceConnection: ${{ parameters.sonarCloud.serviceConnection }}
          ${{ if ne(parameters.sonarCloud.organization, '') }}:
            organization: ${{ parameters.sonarCloud.organization }}
          ${{ if ne(parameters.sonarCloud.projectKey, '') }}:
            projectKey: ${{ parameters.sonarCloud.projectKey }}
          ${{ if ne(parameters.sonarCloud.projectName, '') }}:
            projectName: ${{ parameters.sonarCloud.projectName }}
          ${{ if ne(parameters.sonarCloud.coverageReportPath, '') }}:
            coverageReportPath: ${{ parameters.sonarCloud.coverageReportPath }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'NuGet/authenticate.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if parameters.dotnet.nuGetServiceConnections }}:
            serviceConnections: ${{ parameters.dotnet.nuGetServiceConnections }}

      - template: 'dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/restore.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.restore.enable, '') }}:
            enable: ${{ parameters.dotnet.restore.enable }}
          ${{ if ne(parameters.dotnet.restore.useCache, '') }}:
            useCache: ${{ parameters.dotnet.restore.useCache }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.projects, '') }}:
            projects: ${{ parameters.dotnet.projects }}
          ${{ if ne(parameters.dotnet.configuration, '') }}:
            configuration: ${{ parameters.dotnet.configuration }}
          ${{ if ne(parameters.dotnet.verbosity, '') }}:
            verbosity: ${{ parameters.dotnet.verbosity }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.selfContained, '') }}:
            selfContained: ${{ parameters.dotnet.selfContained }}
          ${{ if ne(parameters.dotnet.publishBinlog, '') }}:
            publishBinlog: ${{ parameters.dotnet.publishBinlog }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/format.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.checks.codeFormatting.enable, '') }}:
            enable: ${{ parameters.dotnet.checks.codeFormatting.enable }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.checks.publishReport, '') }}:
            publishReport: ${{ parameters.dotnet.checks.publishReport }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'NuGet/check-packages.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.checks.outdatedPackages, '') }}:
            outdatedPackages: ${{ parameters.dotnet.checks.outdatedPackages }}
          ${{ if ne(parameters.dotnet.checks.deprecatedPackages, '') }}:
            deprecatedPackages: ${{ parameters.dotnet.checks.deprecatedPackages }}
          ${{ if ne(parameters.dotnet.checks.vulnerablePackages, '') }}:
            vulnerablePackages: ${{ parameters.dotnet.checks.vulnerablePackages }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.checks.publishReport, '') }}:
            publishReport: ${{ parameters.dotnet.checks.publishReport }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/test.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.test.enable, '') }}:
            enable: ${{ parameters.dotnet.test.enable }}
          ${{ if ne(parameters.dotnet.test.projects, '') }}:
            projects: ${{ parameters.dotnet.test.projects }}
          ${{ if ne(parameters.dotnet.configuration, '') }}:
            configuration: ${{ parameters.dotnet.configuration }}
          ${{ if ne(parameters.dotnet.verbosity, '') }}:
            verbosity: ${{ parameters.dotnet.verbosity }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.test.noBuild, '') }}:
            noBuild: ${{ parameters.dotnet.test.noBuild }}
          ${{ if ne(parameters.dotnet.test.publishTestResults, '') }}:
            publishTestResults: ${{ parameters.dotnet.test.publishTestResults }}
          ${{ if ne(parameters.dotnet.test.testRunTitle, '') }}:
            testRunTitle: ${{ parameters.dotnet.test.testRunTitle }}
          ${{ if ne(parameters.dotnet.test.runSettingsFile, '') }}:
            runSettingsFile: ${{ parameters.dotnet.test.runSettingsFile }}
          ${{ if ne(parameters.dotnet.test.collectCoverage, '') }}:
            collectCoverage: ${{ parameters.dotnet.test.collectCoverage }}
          ${{ if ne(parameters.dotnet.test.coverageReportPath, '') }}:
            coverageReportPath: ${{ parameters.dotnet.test.coverageReportPath }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'SonarCloud/analyze.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.sonarCloud.enable, '') }}:
            enable: ${{ parameters.sonarCloud.enable }}

      - template: 'stryker/run.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.stryker.enable, '') }}:
            enable: ${{ parameters.stryker.enable }}
          ${{ if ne(parameters.stryker.project, '') }}:
            project: ${{ parameters.stryker.project }}
          ${{ if ne(parameters.dotnet.configuration, '') }}:
            configuration: ${{ parameters.dotnet.configuration }}
          ${{ if ne(parameters.stryker.thresholdHigh, '') }}:
            thresholdHigh: ${{ parameters.stryker.thresholdHigh }}
          ${{ if ne(parameters.stryker.thresholdLow, '') }}:
            thresholdLow: ${{ parameters.stryker.thresholdLow }}
          ${{ if ne(parameters.stryker.thresholdBreak, '') }}:
            thresholdBreak: ${{ parameters.stryker.thresholdBreak }}
          ${{ if ne(parameters.stryker.mutationLevel, '') }}:
            mutationLevel: ${{ parameters.stryker.mutationLevel }}
          ${{ if ne(parameters.stryker.publishReport, '') }}:
            publishReport: ${{ parameters.stryker.publishReport }}
          ${{ if ne(parameters.stryker.artifactName, '') }}:
            artifactName: ${{ parameters.stryker.artifactName }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'quality/checks.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.quality.jobWarnings, '') }}:
            jobWarnings: ${{ parameters.quality.jobWarnings }}
          ${{ if ne(parameters.quality.coverageChecks, '') }}:
            coverageChecks: ${{ parameters.quality.coverageChecks }}

      - template: '../azuredevops/build/upload-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Upload .NET build summary'
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            condition: |
              and
              (
                always(),
                eq(${{ parameters.buildSummary.enable }}, true)
              )
          ${{ else }}:
            condition: always()
          title: ${{ coalesce(parameters.buildSummary.title, '.NET Build Summary') }}
          includeJobSummary: true
          ${{ if ne(parameters.buildSummary.showSystemInfo, '') }}:
            showSystemInfo: ${{ parameters.buildSummary.showSystemInfo }}
