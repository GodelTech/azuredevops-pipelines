parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: jobName
    displayName: 'Job name'
    type: string
    default: 'BuildDotnet'

  - name: jobDisplayName
    displayName: 'Job display name'
    type: string
    default: 'Build .NET'

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'

  - name: dependsOn
    displayName: 'Job depends on'
    type: object
    default: []

  - name: sonarCloud
    displayName: 'SonarCloud parameters'
    type: object
    default: {}

  - name: dotnet
    displayName: '.NET parameters'
    type: object
    default: {}

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobDisplayName }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn: ${{ parameters.dependsOn }}
    steps:
      - template: 'SonarCloud/prepare.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.sonarCloud.enable, '') }}:
            enable: ${{ parameters.sonarCloud.enable }}
          ${{ if ne(parameters.sonarCloud.serviceConnection, '') }}:
            serviceConnection: ${{ parameters.sonarCloud.serviceConnection }}
          ${{ if ne(parameters.sonarCloud.organization, '') }}:
            organization: ${{ parameters.sonarCloud.organization }}
          ${{ if ne(parameters.sonarCloud.projectKey, '') }}:
            projectKey: ${{ parameters.sonarCloud.projectKey }}
          ${{ if ne(parameters.sonarCloud.projectName, '') }}:
            projectName: ${{ parameters.sonarCloud.projectName }}
          ${{ if ne(parameters.sonarCloud.coverageReportPath, '') }}:
            coverageReportPath: ${{ parameters.sonarCloud.coverageReportPath }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'NuGet/authenticate.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if parameters.dotnet.nuGetServiceConnections }}:
            nuGetServiceConnections: ${{ parameters.dotnet.nuGetServiceConnections }}

      - template: 'dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - script: dotnet restore
        displayName: 'dotnet restore'
        ${{ if ne(parameters.workingDirectory, '') }}:
          workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.projects, '') }}:
            projects: ${{ parameters.dotnet.projects }}
          ${{ if ne(parameters.dotnet.configuration, '') }}:
            configuration: ${{ parameters.dotnet.configuration }}
          ${{ if ne(parameters.dotnet.verbosity, '') }}:
            verbosity: ${{ parameters.dotnet.verbosity }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.selfContained, '') }}:
            selfContained: ${{ parameters.dotnet.selfContained }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/format.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.checkCodeFormatting, '') }}:
            enable: ${{ parameters.dotnet.checkCodeFormatting }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
