parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: jobName
    displayName: 'Job name'
    type: string
    default: 'BuildDotnet'

  - name: jobDisplayName
    displayName: 'Job display name'
    type: string
    default: 'Build .NET'

  - name: vmImage
    displayName: 'Pool VM image'
    type: string
    default: 'ubuntu-latest'

  - name: dependsOn
    displayName: 'Job depends on'
    type: object
    default: []

  - name: sonarCloud
    displayName: 'SonarCloud parameters'
    type: object
    default: {}

  - name: dotnet
    displayName: '.NET parameters'
    type: object
    default: {}

  - name: buildSummary
    displayName: 'Build summary parameters'
    type: object
    default: {}
    # Example:
    # buildSummary:
    #   enable: true
    #   title: 'Build Summary'
    #   showSystemInfo: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.jobDisplayName }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    dependsOn: ${{ parameters.dependsOn }}
    steps:
      - template: 'SonarCloud/prepare.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.sonarCloud.enable, '') }}:
            enable: ${{ parameters.sonarCloud.enable }}
          ${{ if ne(parameters.sonarCloud.serviceConnection, '') }}:
            serviceConnection: ${{ parameters.sonarCloud.serviceConnection }}
          ${{ if ne(parameters.sonarCloud.organization, '') }}:
            organization: ${{ parameters.sonarCloud.organization }}
          ${{ if ne(parameters.sonarCloud.projectKey, '') }}:
            projectKey: ${{ parameters.sonarCloud.projectKey }}
          ${{ if ne(parameters.sonarCloud.projectName, '') }}:
            projectName: ${{ parameters.sonarCloud.projectName }}
          ${{ if ne(parameters.sonarCloud.coverageReportPath, '') }}:
            coverageReportPath: ${{ parameters.sonarCloud.coverageReportPath }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'NuGet/authenticate.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if parameters.dotnet.nuGetServiceConnections }}:
            serviceConnections: ${{ parameters.dotnet.nuGetServiceConnections }}

      - template: 'dotnet/install-SDK.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/restore.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.restore.enable, '') }}:
            enable: ${{ parameters.dotnet.restore.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/build.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.projects, '') }}:
            projects: ${{ parameters.dotnet.projects }}
          ${{ if ne(parameters.dotnet.configuration, '') }}:
            configuration: ${{ parameters.dotnet.configuration }}
          ${{ if ne(parameters.dotnet.verbosity, '') }}:
            verbosity: ${{ parameters.dotnet.verbosity }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.selfContained, '') }}:
            selfContained: ${{ parameters.dotnet.selfContained }}
          ${{ if ne(parameters.dotnet.publishBinlog, '') }}:
            publishBinlog: ${{ parameters.dotnet.publishBinlog }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'dotnet/format.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.checks.codeFormatting.enable, '') }}:
            enable: ${{ parameters.dotnet.checks.codeFormatting.enable }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.checks.publishReport, '') }}:
            publishReport: ${{ parameters.dotnet.checks.publishReport }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: 'NuGet/check-packages.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          ${{ if ne(parameters.dotnet.checks.outdatedPackages, '') }}:
            outdatedPackages: ${{ parameters.dotnet.checks.outdatedPackages }}
          ${{ if ne(parameters.dotnet.checks.deprecatedPackages, '') }}:
            deprecatedPackages: ${{ parameters.dotnet.checks.deprecatedPackages }}
          ${{ if ne(parameters.dotnet.checks.vulnerablePackages, '') }}:
            vulnerablePackages: ${{ parameters.dotnet.checks.vulnerablePackages }}
          ${{ if ne(parameters.dotnet.noRestore, '') }}:
            noRestore: ${{ parameters.dotnet.noRestore }}
          ${{ if ne(parameters.dotnet.checks.publishReport, '') }}:
            publishReport: ${{ parameters.dotnet.checks.publishReport }}
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            appendSummary: ${{ parameters.buildSummary.enable }}
          ${{ if ne(parameters.workingDirectory, '') }}:
            workingDirectory: ${{ parameters.workingDirectory }}

      - template: '../azuredevops/build/upload-summary.yml'
        parameters:
          enableBuildDebug: ${{ parameters.enableBuildDebug }}
          stepDisplayName: 'Upload .NET build summary'
          ${{ if ne(parameters.buildSummary.enable, '') }}:
            condition: |
              and
              (
                always(),
                eq(${{ parameters.buildSummary.enable }}, true)
              )
          ${{ else }}:
            condition: always()
          title: ${{ coalesce(parameters.buildSummary.title, '.NET Build Summary') }}
          includeAccumulatedContent: true
          ${{ if ne(parameters.buildSummary.showSystemInfo, '') }}:
            showSystemInfo: ${{ parameters.buildSummary.showSystemInfo }}
