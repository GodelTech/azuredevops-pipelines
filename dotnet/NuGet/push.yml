parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: feedUrl
    displayName: 'Azure Artifacts feed URL'
    type: string
    default: ''

  - name: packageDir
    displayName: 'Directory containing NuGet packages to push'
    type: string
    default: '$(Build.ArtifactStagingDirectory)/nuget'

  - name: apiKey
    displayName: 'API key for NuGet push (use az for Azure Artifacts)'
    type: string
    default: 'az'

  - name: skipDuplicate
    displayName: 'Skip duplicate packages'
    type: boolean
    default: true

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

steps:
  - pwsh: |
      $enableBuildDebug = [System.Convert]::ToBoolean($env:ENABLE_BUILD_DEBUG)
      $feedUrl = $env:FEED_URL
      $packageDir = $env:PACKAGE_DIR
      $apiKey = $env:API_KEY
      $skipDuplicate = [System.Convert]::ToBoolean($env:SKIP_DUPLICATE)
      $appendSummary = [System.Convert]::ToBoolean($env:APPEND_SUMMARY)
      $agentTempDirectory = $env:AGENT_TEMPDIRECTORY

      $packages = Get-ChildItem -Path $packageDir -Filter '*.nupkg' -Recurse |
        Where-Object { $_.Name -notmatch '\.snupkg$' }

      if ($packages.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]No .nupkg files found in '$packageDir'"
        exit 1
      }

      $packageResults = @()

      foreach ($pkg in $packages) {
        $pushArgs = @(
          'nuget', 'push', $pkg.FullName
          '--source', $feedUrl
          '--api-key', $apiKey
        )

        if ($skipDuplicate) {
          $pushArgs += '--skip-duplicate'
        }

        if ($enableBuildDebug) {
          Write-Host "##[debug]dotnet $($pushArgs -join ' ')"
        }

        Write-Host "Pushing $($pkg.Name)..."
        $output = & dotnet @pushArgs 2>&1 | Out-String
        $exitCode = $LASTEXITCODE
        Write-Host $output

        if ($exitCode -ne 0) {
          Write-Host "##vso[task.logissue type=error]Failed to push $($pkg.Name)"
          $packageResults += @{ Name = $pkg.Name; Result = 'Failed' }
        } elseif ($output -match 'already exists') {
          $packageResults += @{ Name = $pkg.Name; Result = 'SkippedDuplicate' }
        } else {
          $packageResults += @{ Name = $pkg.Name; Result = 'Pushed' }
        }
      }

      $failedCount = @($packageResults | Where-Object { $_.Result -eq 'Failed' }).Count

      if ($appendSummary) {
        $resultDisplayMap = @{
          'Pushed' = '✅ Pushed'
          'SkippedDuplicate' = '⚠️ Skipped (already exists)'
          'Failed' = '❌ Failed'
        }
        $packageDetailLines = @("| Package | Result |", "| --- | --- |")
        $packageDetailLines += $packageResults | ForEach-Object { "| $($_.Name) | $($resultDisplayMap[$_.Result]) |" }

        $pushedCount = @($packageResults | Where-Object { $_.Result -eq 'Pushed' }).Count
        $skippedCount = @($packageResults | Where-Object { $_.Result -eq 'SkippedDuplicate' }).Count

        if ($failedCount -gt 0) {
          $result = '❌ Failed'
        } elseif ($pushedCount -eq 0 -and $skippedCount -gt 0) {
          $result = '⚠️ Skipped (all packages already exist)'
        } elseif ($skippedCount -gt 0) {
          $result = "✅ Succeeded ($pushedCount pushed, $skippedCount skipped)"
        } else {
          $result = '✅ Succeeded'
        }

        $summaryLines = @(
          "## NuGet Push",
          "",
          "| Property | Value |",
          "| --- | --- |",
          "| Feed URL | [$feedUrl]($feedUrl) |",
          "| Result | $result |",
          ""
        )
        $summaryLines += $packageDetailLines
        $summaryLines += ""

        $summaryPath = "$agentTempDirectory/job-summary.md"
        Add-Content -Path $summaryPath -Value ($summaryLines -join "`n") -Encoding UTF8
      }

      if ($failedCount -gt 0) {
        exit 1
      }
    displayName: 'dotnet nuget push'
    env:
      ENABLE_BUILD_DEBUG: ${{ parameters.enableBuildDebug }}
      FEED_URL: ${{ parameters.feedUrl }}
      PACKAGE_DIR: ${{ parameters.packageDir }}
      API_KEY: ${{ parameters.apiKey }}
      SKIP_DUPLICATE: ${{ parameters.skipDuplicate }}
      APPEND_SUMMARY: ${{ parameters.appendSummary }}
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
