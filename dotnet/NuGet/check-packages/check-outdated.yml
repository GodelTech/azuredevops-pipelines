parameters:
  - name: enableBuildDebug
    displayName: 'Enable build debug'
    type: boolean
    default: false

  - name: enable
    displayName: 'Enable NuGet outdated packages check'
    type: boolean
    default: true

  - name: includePrerelease
    displayName: 'Include prerelease packages in the outdated check'
    type: boolean
    default: false

  - name: includeTransitive
    displayName: 'Include transitive packages in the outdated check'
    type: boolean
    default: true

  - name: warnIfTransitiveExcluded
    displayName: 'Warn when transitive packages are excluded from the outdated check'
    type: boolean
    default: false

  - name: noRestore
    displayName: 'Do not restore packages before checking'
    type: boolean
    default: true

  - name: stepResult
    displayName: 'Step result when outdated top-level packages are found'
    type: string
    default: 'SucceededWithIssues'
    values:
      - Succeeded
      - SucceededWithIssues
      - Failed

  - name: transitiveStepResult
    displayName: 'Step result when outdated transitive packages are found'
    type: string
    default: 'Succeeded'
    values:
      - Succeeded
      - SucceededWithIssues
      - Failed

  - name: publishReport
    displayName: 'Publish NuGet outdated packages report as pipeline artifact'
    type: boolean
    default: true

  - name: artifactName
    displayName: 'Artifact name for the report'
    type: string
    default: 'nuget-outdated-report'

  - name: appendSummary
    displayName: 'Append section to job summary'
    type: boolean
    default: true

  - name: workingDirectory
    displayName: 'Working directory'
    type: string
    default: ''

steps:
  - pwsh: |
      $includePrerelease = [System.Convert]::ToBoolean($env:INCLUDE_PRERELEASE)
      $includeTransitive = [System.Convert]::ToBoolean($env:INCLUDE_TRANSITIVE)
      $warnIfTransitiveExcluded = [System.Convert]::ToBoolean($env:WARN_IF_TRANSITIVE_EXCLUDED)
      $noRestore = [System.Convert]::ToBoolean($env:NO_RESTORE)
      $stepResult = $env:STEP_RESULT
      $transitiveStepResult = $env:TRANSITIVE_STEP_RESULT
      $publishReport = [System.Convert]::ToBoolean($env:PUBLISH_REPORT)
      $artifactName = $env:ARTIFACT_NAME
      $appendSummary = [System.Convert]::ToBoolean($env:APPEND_SUMMARY)

      if (-not $includeTransitive -and $warnIfTransitiveExcluded) {
        Write-Host "##vso[task.logissue type=warning]Transitive packages are excluded from the outdated check."
      }

      $command = 'dotnet list package --outdated --format json'
      if ($includePrerelease) { $command += ' --include-prerelease' }
      if ($includeTransitive) { $command += ' --include-transitive' }
      if ($noRestore) { $command += ' --no-restore' }

      $output = Invoke-Expression $command
      $json = $output | ConvertFrom-Json
      $prettyOutput = $json | ConvertTo-Json -Depth 10
      Write-Host $prettyOutput

      if ($publishReport) {
        $reportPath = "$(Build.ArtifactStagingDirectory)/nuget-reports/${artifactName}.json"
        New-Item -ItemType Directory -Force -Path (Split-Path $reportPath) | Out-Null
        $output | Set-Content -Path $reportPath -Encoding UTF8
      }

      $topLevelPackages = @($json.projects | Where-Object { $_ } | ForEach-Object {
        $_.frameworks | Where-Object { $_ } | ForEach-Object {
          @($_.topLevelPackages) | Where-Object { $_ }
        }
      } | Where-Object { $_.latestVersion -and $_.resolvedVersion -ne $_.latestVersion })

      $transitivePackages = @()
      if ($includeTransitive) {
        $transitivePackages = @($json.projects | Where-Object { $_ } | ForEach-Object {
          $_.frameworks | Where-Object { $_ } | ForEach-Object {
            @($_.transitivePackages) | Where-Object { $_ }
          }
        } | Where-Object { $_.latestVersion -and $_.resolvedVersion -ne $_.latestVersion })
      }

      $severity = @{ 'Failed' = 2; 'SucceededWithIssues' = 1; 'Succeeded' = 0 }
      $finalResult = 'Succeeded'
      if ($topLevelPackages.Count -gt 0 -and $severity[$stepResult] -gt $severity[$finalResult]) {
        $finalResult = $stepResult
      }
      if ($transitivePackages.Count -gt 0 -and $severity[$transitiveStepResult] -gt $severity[$finalResult]) {
        $finalResult = $transitiveStepResult
      }

      if ($topLevelPackages.Count -gt 0 -or $transitivePackages.Count -gt 0) {
        $packageKind = if ($topLevelPackages.Count -gt 0 -and $transitivePackages.Count -gt 0) {
          "'top-level' and 'transitive'"
        } elseif ($topLevelPackages.Count -gt 0) {
          "'top-level'"
        } else {
          "'transitive'"
        }
        $message = "Outdated NuGet $packageKind packages found."
        switch ($finalResult) {
          'SucceededWithIssues' {
            Write-Host "##vso[task.logissue type=warning]$message"
            Write-Host "##vso[task.complete result=SucceededWithIssues;]$message"
          }
          'Failed' {
            Write-Host "##vso[task.logissue type=error]$message"
            Write-Host "##vso[task.complete result=Failed;]$message"
          }
          default {
            Write-Host "##vso[task.logissue type=warning]$message"
          }
        }
      } else {
        Write-Host "All NuGet packages are up to date."
      }

      if ($appendSummary) {
        $summaryPath = "$(Agent.TempDirectory)/job-summary.md"

        $infoLines = @()
        if ($topLevelPackages.Count -eq 0 -and $transitivePackages.Count -eq 0) {
          $infoLines += "✅ All NuGet packages are up to date."
        } else {
          $infoLines += "⚠️ Outdated NuGet packages found."
        }
        if (-not $includeTransitive -and $warnIfTransitiveExcluded) {
          $infoLines += "⚠️ Transitive packages are excluded from the outdated check."
        }
        $infoLines += ""

        $summaryLines = @(
          "## NuGet Outdated Packages Check Results",
          "",
          $infoLines,
          "| Type | Count |",
          "| --- | --- |",
          "| Top-level | $($topLevelPackages.Count) |",
          "| Transitive | $(if ($includeTransitive) { $transitivePackages.Count } else { 'SKIPPED' }) |",
          "",
          "Report artifact: **$artifactName** (published if publish report is enabled)",
          ""
        )
        Add-Content -Path $summaryPath -Value ($summaryLines -join "`n") -Encoding UTF8
      }
    displayName: 'Check NuGet outdated packages'
    condition: |
      and
      (
        succeeded(),
        eq(${{ parameters.enable }}, true)
      )
    ${{ if ne(parameters.workingDirectory, '') }}:
      workingDirectory: ${{ parameters.workingDirectory }}
    env:
      INCLUDE_PRERELEASE: ${{ parameters.includePrerelease }}
      INCLUDE_TRANSITIVE: ${{ parameters.includeTransitive }}
      WARN_IF_TRANSITIVE_EXCLUDED: ${{ parameters.warnIfTransitiveExcluded }}
      NO_RESTORE: ${{ parameters.noRestore }}
      STEP_RESULT: ${{ parameters.stepResult }}
      TRANSITIVE_STEP_RESULT: ${{ parameters.transitiveStepResult }}
      PUBLISH_REPORT: ${{ parameters.publishReport }}
      ARTIFACT_NAME: ${{ parameters.artifactName }}
      APPEND_SUMMARY: ${{ parameters.appendSummary }}

  - publish: '$(Build.ArtifactStagingDirectory)/nuget-reports/${{ parameters.artifactName }}.json'
    displayName: 'Publish NuGet outdated packages report'
    condition: |
      and
      (
        succeededOrFailed(),
        eq(${{ parameters.enable }}, true),
        eq(${{ parameters.publishReport }}, true)
      )
    artifact: ${{ parameters.artifactName }}
